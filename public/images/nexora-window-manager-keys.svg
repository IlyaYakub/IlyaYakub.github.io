<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <g id="key">
      <circle cx="0" cy="12" r="8" fill="none" stroke="#F2F2F2" stroke-width="3"/>
      <path d="M0 20 V48 M0 38 h7 M0 46 h5" stroke="#F2F2F2" stroke-width="3" fill="none"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#5</text>

  <text class="h" x="56" y="172" font-size="72" fill="#F2F2F2" letter-spacing="-3">WINDOW</text>
  <text class="h" x="56" y="240" font-size="72" fill="#F2F2F2" letter-spacing="-3">MANAGER</text>
  <text class="m" x="60" y="276" font-size="18" fill="#F04E0F">one owner for every window</text>

  <rect x="60" y="300" width="500" height="166" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="326" font-size="12" fill="#7A7A7A" letter-spacing="2">MAIN LOOP</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="358">windowManager-&gt;<tspan fill="#F04E0F">createWindow</tspan>(WindowSettings{});</tspan>
    <tspan x="76" y="382">while (!windowManager-&gt;areAllWindowsClosed())</tspan>
    <tspan x="76" y="406">{</tspan>
    <tspan x="76" y="430">    windowManager-&gt;<tspan fill="#F04E0F">update</tspan>();</tspan>
  </text>
  <text class="m" x="76" y="454" font-size="12" fill="#7A7A7A">// update(): glfwPollEvents, drop closed windows</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">~GLFWWindowManager()</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">m_windows.clear(); glfwTerminate();</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// windows first, then GLFW itself</text>

  <g class="m">
    <polygon points="660,130 790,80 920,130" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
    <rect x="672" y="130" width="236" height="410" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
    <text x="790" y="118" font-size="11" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">GLFW</text>

    <rect x="694" y="160" width="56" height="70" fill="#F04E0F"/>
    <text x="722" y="200" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">#1</text>
    <rect x="762" y="160" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="830" y="160" width="56" height="70" fill="#F04E0F">
      <animate attributeName="opacity" values="1;1;0.6;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="858" y="200" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">#2</text>

    <rect x="694" y="256" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="762" y="256" width="56" height="70" fill="#F04E0F">
      <animate attributeName="fill" values="#F04E0F;#F04E0F;#0C0C0C;#0C0C0C;#F04E0F" keyTimes="0;0.4;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="790" y="296" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">#3
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <rect x="830" y="256" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>

    <rect x="694" y="352" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="762" y="352" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="830" y="352" width="56" height="70" fill="#0C0C0C" stroke="#2E2E2E"/>

    <rect x="760" y="460" width="60" height="80" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="2"/>
    <circle cx="808" cy="502" r="3" fill="#F04E0F"/>
    <text x="790" y="452" font-size="10" fill="#7A7A7A" text-anchor="middle">GLFWWindowManager</text>

    <rect x="950" y="96" width="190" height="300" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
    <rect x="950" y="96" width="190" height="30" fill="#F04E0F"/>
    <text x="1045" y="116" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">m_windows</text>
    <text x="966" y="146" font-size="9" fill="#7A7A7A">unordered_map&lt;WindowId,</text>
    <text x="966" y="158" font-size="9" fill="#7A7A7A">  shared_ptr&lt;IWindow&gt;&gt;</text>

    <circle cx="990" cy="184" r="3" fill="#7A7A7A"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 990 184; 6 990 184; -6 990 184" dur="2.4s" repeatCount="indefinite"/>
      <use href="#key" x="990" y="184"/>
      <rect x="1000" y="214" width="34" height="16" fill="#F04E0F"/>
      <text x="1017" y="226" font-size="10" font-weight="700" fill="#141414" text-anchor="middle">{1}</text>
    </g>
    <circle cx="1060" cy="184" r="3" fill="#7A7A7A"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 1060 184; -5 1060 184; 5 1060 184" dur="2.8s" repeatCount="indefinite"/>
      <use href="#key" x="1060" y="184"/>
      <rect x="1070" y="214" width="34" height="16" fill="#F04E0F"/>
      <text x="1087" y="226" font-size="10" font-weight="700" fill="#141414" text-anchor="middle">{2}</text>
    </g>
    <circle cx="990" cy="276" r="3" fill="#7A7A7A"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
      <use href="#key" x="990" y="276"/>
      <rect x="1000" y="306" width="34" height="16" fill="#F04E0F"/>
      <text x="1017" y="318" font-size="10" font-weight="700" fill="#141414" text-anchor="middle">{3}</text>
    </g>
    <circle cx="1060" cy="276" r="3" fill="#7A7A7A"/>
    <text x="1060" y="300" font-size="9" fill="#2E2E2E" text-anchor="middle">free</text>
    <text x="966" y="380" font-size="9" fill="#7A7A7A">closed → removed in update()</text>

    <path d="M908 210 H950" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="3 4"/>

    <rect x="960" y="438" width="170" height="54" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="974" y="460" font-size="11" fill="#F2F2F2">glfwPollEvents()</text>
    <text x="974" y="478" font-size="10" fill="#7A7A7A">once per frame</text>
    <circle cx="1108" cy="465" r="6" fill="#F04E0F"/>
    <circle cx="1108" cy="465" r="6" fill="none" stroke="#F04E0F" stroke-width="2">
      <animate attributeName="r" values="6;20" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="960" y="524" font-size="10" fill="#7A7A7A">handed out as shared_ptr,</text>
    <text x="960" y="538" font-size="10" fill="#7A7A7A">never as a raw pointer</text>
  </g>
</svg>
