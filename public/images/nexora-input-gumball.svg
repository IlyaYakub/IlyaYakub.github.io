<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="globe"><circle cx="860" cy="210" r="126"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#6</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">INPUT</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">one event, six kinds of data</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">INPUT/INPUTEVENT.H</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">struct <tspan fill="#F04E0F">InputEvent</tspan></tspan>
    <tspan x="76" y="346">{</tspan>
    <tspan x="76" y="370">    WindowId       windowId;</tspan>
    <tspan x="76" y="394">    InputEventData data;  <tspan fill="#7A7A7A">// std::variant</tspan></tspan>
    <tspan x="76" y="418">};</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// engine enums, not GLFW codes</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">enum class Key : uint16 { Unknown, Escape, ... }</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">window-&gt;windowEvent().add(...);</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// Event&lt;const InputEvent&amp;&gt; per window</text>

  <g class="m">
    <circle cx="860" cy="210" r="130" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="4"/>
    <g clip-path="url(#globe)" font-size="13" font-weight="700" text-anchor="middle">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 2; 0 0" dur="1.6s" repeatCount="indefinite"/>
        <circle cx="800" cy="300" r="24" fill="#F04E0F"/><text x="800" y="305" fill="#141414">K</text>
        <circle cx="850" cy="306" r="24" fill="#F2F2F2"/><text x="850" y="311" fill="#141414">M</text>
        <circle cx="900" cy="298" r="24" fill="#7A7A7A"/><text x="900" y="303" fill="#141414">↕</text>
        <circle cx="946" cy="284" r="24" fill="#F04E0F"/><text x="946" y="289" fill="#141414">⤡</text>
        <circle cx="770" cy="258" r="24" fill="#F2F2F2"/><text x="770" y="263" fill="#141414">✕</text>
        <circle cx="822" cy="256" r="24" fill="#7A7A7A"/><text x="822" y="261" fill="#141414">➚</text>
        <circle cx="874" cy="252" r="24" fill="#F04E0F"/><text x="874" y="257" fill="#141414">K</text>
        <circle cx="926" cy="238" r="24" fill="#F2F2F2"/><text x="926" y="243" fill="#141414">M</text>
        <circle cx="796" cy="212" r="24" fill="#F04E0F"/><text x="796" y="217" fill="#141414">↕</text>
        <circle cx="848" cy="206" r="24" fill="#F2F2F2"/><text x="848" y="211" fill="#141414">✕</text>
        <circle cx="900" cy="192" r="24" fill="#7A7A7A"/><text x="900" y="197" fill="#141414">⤡</text>
        <circle cx="824" cy="162" r="24" fill="#7A7A7A"/><text x="824" y="167" fill="#141414">➚</text>
      </g>
    </g>
    <path d="M770 130 A110 110 0 0 1 860 96" fill="none" stroke="#F2F2F2" stroke-width="5" opacity="0.5"/>
    <rect x="838" y="68" width="44" height="16" fill="#F04E0F"/>

    <polygon points="770,334 950,334 990,500 730,500" fill="#F04E0F"/>
    <rect x="720" y="500" width="280" height="16" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="860" y="362" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">std::variant</text>
    <circle cx="860" cy="414" r="30" fill="#1A1A1A" stroke="#141414" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 860 414; 0 860 414; 180 860 414; 180 860 414" keyTimes="0;0.7;0.85;1" dur="1s" repeatCount="indefinite"/>
      <rect x="834" y="408" width="52" height="12" fill="#F2F2F2"/>
    </g>
    <rect x="922" y="452" width="48" height="36" fill="#141414"/>
    <path d="M970 470 H1000" stroke="#141414" stroke-width="8"/>

    <text x="1010" y="104" font-size="10" fill="#7A7A7A" letter-spacing="1">InputEventData</text>
    <g font-size="10" fill="#7A7A7A">
      <text x="1010" y="128">KeyEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="0s" repeatCount="indefinite"/></text>
      <text x="1010" y="148">MouseButtonEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="1s" repeatCount="indefinite"/></text>
      <text x="1010" y="168">MouseMoveEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="2s" repeatCount="indefinite"/></text>
      <text x="1010" y="188">MouseScrollEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="3s" repeatCount="indefinite"/></text>
      <text x="1010" y="208">WindowResizeEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="4s" repeatCount="indefinite"/></text>
      <text x="1010" y="228">WindowCloseEventData<animate attributeName="fill" values="#F04E0F;#7A7A7A;#7A7A7A" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="5s" repeatCount="indefinite"/></text>
    </g>
    <text x="1010" y="256" font-size="10" fill="#7A7A7A">holds exactly one</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="-40 0; 0 0; 0 0" keyTimes="0;0.15;1" dur="1s" repeatCount="indefinite"/>
      <path d="M1010 470 a40 40 0 0 1 80 0 Z" fill="#F04E0F"/>
      <path d="M1010 470 a40 40 0 0 0 80 0 Z" fill="#F2F2F2"/>
    </g>
    <g font-size="10" font-weight="700" fill="#F2F2F2" text-anchor="middle">
      <text x="1050" y="534" opacity="0">Key<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="0s" repeatCount="indefinite"/></text>
      <text x="1050" y="534" opacity="0">MouseButton<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="1s" repeatCount="indefinite"/></text>
      <text x="1050" y="534" opacity="0">MouseMove<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="2s" repeatCount="indefinite"/></text>
      <text x="1050" y="534" opacity="0">MouseScroll<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="3s" repeatCount="indefinite"/></text>
      <text x="1050" y="534" opacity="0">WindowResize<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="4s" repeatCount="indefinite"/></text>
      <text x="1050" y="534" opacity="0">WindowClose<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1667;1" calcMode="discrete" dur="6s" begin="5s" repeatCount="indefinite"/></text>
    </g>
    <text x="1050" y="550" font-size="9" fill="#7A7A7A" text-anchor="middle">windowId #1</text>
  </g>
</svg>
