<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="film"><rect x="1050" y="70" width="90" height="480"/></clipPath>
    <g id="frame">
      <rect x="1062" y="0" width="66" height="56" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
      <text x="1095" y="33" font-size="10" fill="#B0B0B0" text-anchor="middle">tick</text>
      <text x="1095" y="74" font-size="9" fill="#F04E0F" text-anchor="middle">dt</text>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#9</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">TIMER</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">how long did the last frame take</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">TIMER::TICK</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">const auto now = steady_clock::now();</tspan>
    <tspan x="76" y="346"><tspan fill="#F04E0F">m_deltaSeconds</tspan> =</tspan>
    <tspan x="76" y="370">    duration&lt;float&gt;(now - m_lastTickTime);</tspan>
    <tspan x="76" y="394">m_totalSeconds = duration&lt;float&gt;(now - m_startTime);</tspan>
    <tspan x="76" y="418">m_lastTickTime = now;</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// ticked once per frame by the engine loop</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">TEST(TimerTest, ShouldMeasureElapsedTimeBetweenTicks)</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">EXPECT_GT(timer.deltaSeconds(), 0.0f);</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// steady_clock never goes back in time</text>

  <g class="m">
    <rect x="828" y="70" width="44" height="26" fill="#F2F2F2"/>
    <rect x="840" y="96" width="20" height="24" fill="#B0B0B0"/>
    <g transform="rotate(40 850 330)">
      <rect x="840" y="112" width="20" height="18" fill="#F04E0F"/>
    </g>
    <circle cx="850" cy="330" r="196" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="8"/>
    <circle cx="850" cy="330" r="176" fill="none" stroke="#7A7A7A" stroke-width="14" stroke-dasharray="2 16.43"/>
    <circle cx="850" cy="330" r="176" fill="none" stroke="#F2F2F2" stroke-width="22" stroke-dasharray="4 88.15"/>
    <text x="850" y="196" font-size="18" font-weight="700" fill="#F2F2F2" text-anchor="middle">0</text>
    <text x="990" y="337" font-size="18" font-weight="700" fill="#F2F2F2" text-anchor="middle">15</text>
    <text x="850" y="478" font-size="18" font-weight="700" fill="#F2F2F2" text-anchor="middle">30</text>
    <text x="710" y="337" font-size="18" font-weight="700" fill="#F2F2F2" text-anchor="middle">45</text>

    <path d="M850 330 L850 160 A170 170 0 0 1 870 161 Z" fill="#F04E0F" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" values="0 850 330; 360 850 330" dur="4s" repeatCount="indefinite"/>
    </path>

    <circle cx="850" cy="400" r="40" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="850" y="390" font-size="10" fill="#7A7A7A" text-anchor="middle">total</text>
    <line x1="850" y1="400" x2="850" y2="370" stroke="#F2F2F2" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 850 400; 360 850 400" dur="60s" repeatCount="indefinite"/>
    </line>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 850 330; 360 850 330" dur="4s" repeatCount="indefinite"/>
      <line x1="850" y1="360" x2="850" y2="158" stroke="#F04E0F" stroke-width="4"/>
    </g>
    <circle cx="850" cy="330" r="10" fill="#F04E0F"/>
    <circle cx="850" cy="330" r="4" fill="#141414"/>
    <text x="850" y="290" font-size="12" font-weight="700" fill="#F04E0F" text-anchor="middle">dt = 16.6 ms</text>

    <rect x="1050" y="70" width="90" height="480" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <g clip-path="url(#film)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -80" dur="1s" repeatCount="indefinite"/>
        <use href="#frame" y="80"/><use href="#frame" y="160"/><use href="#frame" y="240"/><use href="#frame" y="320"/>
        <use href="#frame" y="400"/><use href="#frame" y="480"/><use href="#frame" y="560"/>
        <g fill="#2E2E2E">
          <rect x="1052" y="70" width="6" height="560"/>
          <rect x="1132" y="70" width="6" height="560"/>
        </g>
      </g>
    </g>
    <text x="1095" y="566" font-size="10" fill="#7A7A7A" text-anchor="middle">frames</text>
  </g>
</svg>
