<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#7</text>

  <text class="h" x="56" y="192" font-size="72" fill="#F2F2F2" letter-spacing="-3">CALLBACKS</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">GLFW codes, patched into engine keys</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">GLFWWINDOW.CPP</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">glfwSetWindowUserPointer(m_window, <tspan fill="#F04E0F">this</tspan>);</tspan>
    <tspan x="76" y="346">glfwSetKeyCallback(m_window, [](...)</tspan>
    <tspan x="76" y="370">{</tspan>
    <tspan x="76" y="394">    auto* <tspan fill="#F04E0F">self</tspan> = static_cast&lt;GLFWWindow*&gt;(</tspan>
    <tspan x="76" y="418">        glfwGetWindowUserPointer(window));</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// a C callback has no this: the user pointer brings it</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">GLFWKeyMapper::toKey(int32 glfwKey)</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">case GLFW_KEY_W: return Key::W;</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// a flat switch, Key::Unknown by default</text>

  <g class="m">
    <rect x="640" y="70" width="500" height="380" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
    <rect x="640" y="70" width="500" height="32" fill="#F04E0F"/>
    <text x="890" y="91" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="2">GLFWKEYMAPPER · SWITCHBOARD</text>
    <text x="660" y="124" font-size="10" fill="#7A7A7A" letter-spacing="1">GLFW</text>
    <text x="1120" y="124" font-size="10" fill="#7A7A7A" letter-spacing="1" text-anchor="end">NEXORA</text>

    <g font-size="11">
      <text x="660" y="152" fill="#B0B0B0">KEY_ESCAPE 256</text>
      <text x="660" y="212" fill="#B0B0B0">KEY_W 87</text>
      <text x="660" y="272" fill="#B0B0B0">MOUSE_LEFT 0</text>
      <text x="660" y="332" fill="#B0B0B0">PRESS 1</text>
      <text x="660" y="392" fill="#7A7A7A">KEY_F25 314</text>
      <text x="1120" y="152" fill="#F2F2F2" text-anchor="end">Key::Escape</text>
      <text x="1120" y="212" fill="#F2F2F2" text-anchor="end">Key::W</text>
      <text x="1120" y="272" fill="#F2F2F2" text-anchor="end">MouseButton::Left</text>
      <text x="1120" y="332" fill="#F2F2F2" text-anchor="end">InputAction::Press</text>
      <text x="1120" y="392" fill="#7A7A7A" text-anchor="end">Key::Unknown</text>
    </g>
    <g fill="#0C0C0C" stroke="#7A7A7A" stroke-width="2">
      <circle cx="780" cy="148" r="8"/><circle cx="780" cy="208" r="8"/><circle cx="780" cy="268" r="8"/><circle cx="780" cy="328" r="8"/><circle cx="780" cy="388" r="8"/>
      <circle cx="990" cy="148" r="8"/><circle cx="990" cy="208" r="8"/><circle cx="990" cy="268" r="8"/><circle cx="990" cy="328" r="8"/><circle cx="990" cy="388" r="8"/>
    </g>

    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M780 148 C860 230 910 70 990 148" stroke="#F04E0F"/>
      <path d="M780 208 C850 300 920 130 990 208" stroke="#F2F2F2"/>
      <path d="M780 268 C860 340 910 200 990 268" stroke="#F04E0F"/>
