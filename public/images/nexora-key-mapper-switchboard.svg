      <circle cx="780" cy="148" r="5"/><circle cx="780" cy="208" r="5"/><circle cx="780" cy="268" r="5"/><circle cx="780" cy="328" r="5"/>
      <circle cx="990" cy="148" r="5"/><circle cx="990" cy="208" r="5"/><circle cx="990" cy="268" r="5"/><circle cx="990" cy="328" r="5"/>
    </g>

    <rect x="640" y="474" width="210" height="76" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="654" y="496" font-size="10" fill="#7A7A7A" letter-spacing="1">USER POINTER</text>
    <rect x="654" y="508" width="60" height="28" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="684" y="527" font-size="11" fill="#F2F2F2" text-anchor="middle">window</text>
    <path d="M714 522 H756" stroke="#F04E0F" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 42;42 0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <rect x="760" y="508" width="76" height="28" fill="#F04E0F"/>
    <text x="798" y="527" font-size="11" font-weight="700" fill="#141414" text-anchor="middle">self</text>

    <rect x="870" y="474" width="270" height="76" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="884" y="496" font-size="10" fill="#7A7A7A" letter-spacing="1">OUT</text>
    <text x="884" y="518" font-size="11" fill="#F2F2F2">m_windowEvent.invoke(</text>
    <text x="884" y="536" font-size="11" fill="#F04E0F">  InputEvent{id, data});</text>
