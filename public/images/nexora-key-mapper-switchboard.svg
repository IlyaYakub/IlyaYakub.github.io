      <path d="M780 388 C840 440 940 440 990 388" stroke="#7A7A7A" stroke-dasharray="6 6"/>
    </g>
    <g fill="none" stroke="#FFC23D" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 300">
      <path d="M780 148 C860 230 910 70 990 148"><animate attributeName="stroke-dashoffset" values="0;-310" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M780 208 C850 300 920 130 990 208"><animate attributeName="stroke-dashoffset" values="0;-310" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></path>
      <path d="M780 268 C860 340 910 200 990 268"><animate attributeName="stroke-dashoffset" values="0;-310" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></path>
      <path d="M780 328 C850 410 930 270 990 328"><animate attributeName="stroke-dashoffset" values="0;-310" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></path>
    </g>
