<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="air"><rect x="640" y="60" width="500" height="500"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#3</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">EVENT</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">one call, every listener hears it</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">EVENT&lt;INT32&gt;</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">Event&lt;int32&gt; onResize;</tspan>
    <tspan x="76" y="346">auto handle = onResize.<tspan fill="#F04E0F">add</tspan>(</tspan>
    <tspan x="76" y="370">    [](int32 width) { ... });</tspan>
    <tspan x="76" y="394">onResize.<tspan fill="#F04E0F">invoke</tspan>(1600);</tspan>
    <tspan x="76" y="418">onResize.<tspan fill="#F04E0F">remove</tspan>(handle);</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// like Unreal's multicast delegate</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">TEST(EventTest, ShouldInvokeListenersInSubscriptionOrder)</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">EXPECT_EQ(calls, (std::vector&lt;int32&gt;{2, 20}));</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// listeners run in the order they were added</text>

  <g class="m">
    <g clip-path="url(#air)" fill="none" stroke="#F04E0F" stroke-width="3">
      <circle cx="730" cy="190" r="20">
        <animate attributeName="r" values="20;420" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="190" r="20">
        <animate attributeName="r" values="20;420" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="190" r="20">
        <animate attributeName="r" values="20;420" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <polygon points="690,520 770,520 730,196" fill="none" stroke="#F2F2F2" stroke-width="3"/>
    <polyline points="700,480 760,440 706,400 754,360 712,320 748,280 718,240 742,220" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <line x1="730" y1="196" x2="730" y2="170" stroke="#F2F2F2" stroke-width="3"/>
    <circle cx="730" cy="166" r="9" fill="#F04E0F"/>
    <rect x="664" y="520" width="132" height="12" fill="#2E2E2E"/>
    <rect x="652" y="76" width="156" height="50" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="730" y="98" font-size="12" font-weight="700" fill="#F2F2F2" text-anchor="middle">onResize</text>
    <text x="730" y="116" font-size="12" fill="#F04E0F" text-anchor="middle">invoke(1600)</text>

    <rect x="960" y="110" width="170" height="80" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <line x1="1110" y1="110" x2="1122" y2="86" stroke="#F2F2F2" stroke-width="2"/>
    <circle cx="1122" cy="84" r="4" fill="#F2F2F2"/>
    <circle cx="984" cy="134" r="9" fill="#F04E0F" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15;0.15" keyTimes="0;0.1;0.3;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1002" y="138" font-size="12" font-weight="700" fill="#F2F2F2">listener 1</text>
    <text x="976" y="166" font-size="11" fill="#7A7A7A">calls += width</text>
    <text x="976" y="182" font-size="10" fill="#7A7A7A">EventHandle{1}</text>

    <rect x="960" y="240" width="170" height="80" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <line x1="1110" y1="240" x2="1122" y2="216" stroke="#F2F2F2" stroke-width="2"/>
    <circle cx="1122" cy="214" r="4" fill="#F2F2F2"/>
    <circle cx="984" cy="264" r="9" fill="#F04E0F" opacity="0.15">
      <animate attributeName="opacity" values="0.15;1;0.15;0.15" keyTimes="0;0.1;0.3;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1002" y="268" font-size="12" font-weight="700" fill="#F2F2F2">listener 2</text>
    <text x="976" y="296" font-size="11" fill="#7A7A7A">calls += width * 10</text>
    <text x="976" y="312" font-size="10" fill="#7A7A7A">EventHandle{2}</text>

    <rect x="960" y="370" width="170" height="80" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="984" cy="394" r="9" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <text x="1002" y="398" font-size="12" font-weight="700" fill="#7A7A7A">listener 3</text>
    <text x="976" y="426" font-size="11" fill="#7A7A7A">remove(handle)</text>
    <text x="976" y="442" font-size="10" fill="#7A7A7A">tuned out</text>
    <path d="M1110 370 l10 -12 m-4 0 l8 8" stroke="#7A7A7A" stroke-width="2" fill="none"/>

    <text x="960" y="486" font-size="11" fill="#7A7A7A" letter-spacing="2">std::function&lt;void(Args...)&gt;</text>
    <text x="960" y="506" font-size="11" fill="#7A7A7A">lambdas or add(this, &amp;Type::method)</text>
  </g>
</svg>
