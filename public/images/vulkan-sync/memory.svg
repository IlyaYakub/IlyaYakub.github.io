<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="420" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="419" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">memory barrier: finishing is not enough, the data has to travel</text>

    <rect x="40" y="80" width="230" height="200" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="155" y="108" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">writer</text>
    <text x="155" y="128" font-size="12" fill="#7A7A7A" text-anchor="middle">color output</text>
    <rect x="70" y="170" width="170" height="80" fill="#0C0C0C" stroke="#7A7A7A" stroke-width="2"/>
    <text x="155" y="190" font-size="11" fill="#7A7A7A" text-anchor="middle">its cache</text>

    <rect x="365" y="110" width="230" height="140" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="480" y="138" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">memory</text>
    <text x="480" y="158" font-size="12" fill="#7A7A7A" text-anchor="middle">L2 / VRAM</text>

    <rect x="690" y="80" width="230" height="200" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="805" y="108" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">reader</text>
    <text x="805" y="128" font-size="12" fill="#7A7A7A" text-anchor="middle">fragment shader</text>
    <rect x="720" y="170" width="170" height="80" fill="#0C0C0C" stroke="#7A7A7A" stroke-width="2"/>
    <text x="805" y="190" font-size="11" fill="#7A7A7A" text-anchor="middle">its cache</text>

    <g>
      <rect x="770" y="202" width="70" height="34" fill="#2E2E2E" stroke="#7A7A7A" stroke-width="2"/>
      <text x="805" y="225" font-size="13" fill="#B0B0B0" text-anchor="middle">old</text>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.65;0.95;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <line x1="770" y1="202" x2="840" y2="236" stroke="#FF4D4D" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.62;0.65" dur="7s" repeatCount="indefinite"/>
    </line>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 325 -20; 325 -20; 650 0; 650 0" keyTimes="0;0.12;0.38;0.5;0.68;1" dur="7s" repeatCount="indefinite"/>
      <rect x="120" y="202" width="70" height="34" fill="#F04E0F"/>
      <text x="155" y="225" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">new</text>
    </g>

    <path d="M270 190 H357" stroke="#F04E0F" stroke-width="3"/>
    <path d="M349 183 L359 190 L349 197" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <path d="M595 190 H682" stroke="#F2F2F2" stroke-width="3"/>
    <path d="M674 183 L684 190 L674 197" fill="none" stroke="#F2F2F2" stroke-width="3"/>

    <text x="155" y="318" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle">1. make available</text>
    <text x="155" y="340" font-size="12" fill="#B0B0B0" text-anchor="middle">srcAccessMask =</text>
    <text x="155" y="358" font-size="12" fill="#B0B0B0" text-anchor="middle">COLOR_ATTACHMENT_WRITE</text>
    <text x="480" y="318" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">flush, then invalidate</text>
    <text x="480" y="340" font-size="12" fill="#7A7A7A" text-anchor="middle">done by the barrier,</text>
    <text x="480" y="358" font-size="12" fill="#7A7A7A" text-anchor="middle">you only say what kind</text>
    <text x="805" y="318" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">2. make visible</text>
    <text x="805" y="340" font-size="12" fill="#B0B0B0" text-anchor="middle">dstAccessMask =</text>
    <text x="805" y="358" font-size="12" fill="#B0B0B0" text-anchor="middle">SHADER_SAMPLED_READ</text>

    <text x="30" y="400" font-size="13" fill="#B0B0B0">without it the reader may see the old value from its own cache, even though the writer is done</text>
  </g>
</svg>
