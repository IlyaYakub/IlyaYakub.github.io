<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="440" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="439" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">execution barrier: B waits for A, but only where it matters</text>

    <g font-size="12" fill="#7A7A7A" text-anchor="middle">
      <text x="300" y="82">TOP</text>
      <text x="430" y="82">VERTEX</text>
      <text x="560" y="82">FRAGMENT</text>
      <text x="690" y="82">COLOR OUT</text>
      <text x="820" y="82">BOTTOM</text>
    </g>
    <g stroke="#2E2E2E" stroke-width="2">
      <line x1="365" y1="94" x2="365" y2="350"/><line x1="495" y1="94" x2="495" y2="350"/>
      <line x1="625" y1="94" x2="625" y2="350"/><line x1="755" y1="94" x2="755" y2="350"/>
    </g>

    <rect x="240" y="108" width="515" height="84" fill="#F04E0F" opacity="0.1" stroke="#F04E0F" stroke-dasharray="6 4"/>
    <text x="30" y="144" font-size="15" font-weight="700" fill="#F2F2F2">cmd A</text>
    <text x="30" y="166" font-size="12" fill="#7A7A7A">draw, writes img</text>
    <circle cy="150" r="20" fill="#F04E0F">
      <animate attributeName="cx" values="300;430;560;690;690;820;820" keyTimes="0;0.1;0.2;0.3;0.5;0.6;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="250" y="210" font-size="12" fill="#F04E0F">srcStageMask = COLOR_ATTACHMENT_OUTPUT</text>

    <line x1="240" y1="232" x2="900" y2="232" stroke="#FFC23D" stroke-width="3"/>
    <text x="900" y="226" font-size="12" font-weight="700" fill="#FFC23D" text-anchor="end">vkCmdPipelineBarrier2</text>

    <rect x="495" y="250" width="405" height="84" fill="#F2F2F2" opacity="0.07" stroke="#F2F2F2" stroke-dasharray="6 4"/>
    <text x="30" y="286" font-size="15" font-weight="700" fill="#F2F2F2">cmd B</text>
    <text x="30" y="308" font-size="12" fill="#7A7A7A">draw, samples img</text>
    <rect x="483" y="256" width="8" height="72" fill="#FF4D4D">
      <animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.5;0.52;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cy="292" r="20" fill="#F2F2F2">
      <animate attributeName="cx" values="300;300;430;460;460;560;690;820;820" keyTimes="0;0.05;0.15;0.2;0.5;0.62;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="505" y="352" font-size="12" fill="#B0B0B0">dstStageMask = FRAGMENT_SHADER</text>

    <text x="30" y="396" font-size="13" fill="#B0B0B0">B's vertex work runs right away; B stops only before the fragment shader,</text>
    <text x="30" y="418" font-size="13" fill="#B0B0B0">and goes on once A has finished writing color</text>
  </g>
</svg>
