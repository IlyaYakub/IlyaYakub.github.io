<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="400" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="399" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="44" font-size="16" font-weight="700" fill="#F04E0F">everything runs at the same time</text>

    <text x="30" y="124" font-size="16" font-weight="700" fill="#F2F2F2">CPU</text>
    <rect x="120" y="96" width="150" height="44" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="195" y="124" font-size="15" fill="#F2F2F2" text-anchor="middle">record 0</text>
    <rect x="290" y="96" width="150" height="44" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="365" y="124" font-size="15" fill="#B0B0B0" text-anchor="middle">record 1</text>
    <rect x="460" y="96" width="150" height="44" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="535" y="124" font-size="15" fill="#F2F2F2" text-anchor="middle">record 2</text>
    <rect x="630" y="96" width="150" height="44" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="705" y="124" font-size="15" fill="#B0B0B0" text-anchor="middle">record 3</text>

    <path d="M270 140 L300 210" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M440 140 L520 210" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="250" y="182" font-size="13" fill="#7A7A7A" text-anchor="end">submit</text>

    <text x="30" y="270" font-size="16" font-weight="700" fill="#F2F2F2">GPU</text>
    <rect x="300" y="214" width="200" height="30" fill="#F04E0F"/>
    <text x="310" y="235" font-size="13" font-weight="700" fill="#141414">clear</text>
    <rect x="340" y="250" width="220" height="30" fill="#F04E0F" opacity="0.75"/>
    <text x="350" y="271" font-size="13" font-weight="700" fill="#141414">draw A</text>
    <rect x="380" y="286" width="150" height="30" fill="#F04E0F" opacity="0.5"/>
    <text x="390" y="307" font-size="13" font-weight="700" fill="#141414">draw B</text>
    <rect x="560" y="214" width="200" height="30" fill="#F2F2F2"/>
    <text x="570" y="235" font-size="13" font-weight="700" fill="#141414">clear</text>
    <rect x="600" y="250" width="220" height="30" fill="#F2F2F2" opacity="0.75"/>
    <text x="610" y="271" font-size="13" font-weight="700" fill="#141414">draw A</text>
    <rect x="640" y="286" width="250" height="30" fill="#F2F2F2" opacity="0.5"/>
    <text x="650" y="307" font-size="13" font-weight="700" fill="#141414">draw B</text>
    <text x="300" y="340" font-size="13" fill="#F04E0F">frame 0</text>
    <text x="560" y="340" font-size="13" fill="#B0B0B0">frame 1</text>

    <line x1="100" y1="372" x2="930" y2="372" stroke="#2E2E2E" stroke-width="2"/>
    <path d="M920 366 L932 372 L920 378" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <text x="930" y="394" font-size="12" fill="#7A7A7A" text-anchor="end">time</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 800 0" dur="6s" repeatCount="indefinite"/>
      <line x1="110" y1="80" x2="110" y2="360" stroke="#FFC23D" stroke-width="2"/>
      <text x="110" y="74" font-size="12" fill="#FFC23D" text-anchor="middle">now</text>
    </g>
    <text x="930" y="44" font-size="13" fill="#7A7A7A" text-anchor="end">draws start in order, overlap, finish in any order</text>
  </g>
</svg>
