<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="400" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="399" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="44" font-size="16" font-weight="700" fill="#F04E0F">semaphore: one GPU step waits for another</text>
    <text x="930" y="44" font-size="13" fill="#7A7A7A" text-anchor="end">the CPU is not involved</text>

    <rect x="40" y="130" width="160" height="90" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="120" y="170" font-size="16" font-weight="700" fill="#F2F2F2" text-anchor="middle">acquire</text>
    <text x="120" y="194" font-size="12" fill="#7A7A7A" text-anchor="middle">signals S1</text>

    <rect x="280" y="100" width="420" height="150" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="296" y="126" font-size="15" font-weight="700" fill="#F04E0F">submit</text>
    <text x="684" y="126" font-size="12" fill="#7A7A7A" text-anchor="end">waits S1, signals S2</text>
    <g font-size="13" text-anchor="middle">
      <rect x="296" y="150" width="120" height="70" fill="#F2F2F2">
        <animate attributeName="opacity" values="0.25;1;1;1" keyTimes="0;0.08;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="356" y="190" fill="#141414" font-weight="700">vertex</text>
      <rect x="426" y="150" width="120" height="70" fill="#F2F2F2">
        <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.12;0.2;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="486" y="190" fill="#141414" font-weight="700">fragment</text>
      <rect x="556" y="150" width="128" height="70" fill="#F04E0F">
        <animate attributeName="opacity" values="0.2;0.2;1;1" keyTimes="0;0.45;0.5;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="620" y="182" fill="#141414" font-weight="700">color</text>
      <text x="620" y="200" fill="#141414" font-weight="700">output</text>
    </g>
    <line x1="551" y1="140" x2="551" y2="232" stroke="#FFC23D" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="551" y="268" font-size="12" fill="#FFC23D" text-anchor="middle">waits here only</text>

    <rect x="780" y="130" width="140" height="90" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="850" y="170" font-size="16" font-weight="700" fill="#F2F2F2" text-anchor="middle">present</text>
    <text x="850" y="194" font-size="12" fill="#7A7A7A" text-anchor="middle">waits S2</text>

    <path d="M200 300 H620 V226" fill="none" stroke="#F04E0F" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M200 175 V300" stroke="#F04E0F" stroke-width="2" stroke-dasharray="5 5"/>
    <circle r="11" fill="#F04E0F">
      <animateMotion path="M200 220 V300 H620 V226" dur="6s" keyPoints="0;0;1;1" keyTimes="0;0.1;0.45;1" calcMode="linear" repeatCount="indefinite"/>
    </circle>
    <text x="410" y="322" font-size="13" font-weight="700" fill="#F04E0F" text-anchor="middle">S1 · image available</text>

    <path d="M700 175 H772" stroke="#F04E0F" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="700" cy="175" r="11" fill="#F04E0F" opacity="0">
      <animate attributeName="cx" values="700;700;772;772" keyTimes="0;0.6;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.59;0.6;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="740" y="160" font-size="13" font-weight="700" fill="#F04E0F" text-anchor="middle">S2</text>

    <text x="30" y="370" font-size="13" fill="#B0B0B0">the vertex and fragment work start before the image is even free; only writing the color has to wait</text>
  </g>
</svg>
