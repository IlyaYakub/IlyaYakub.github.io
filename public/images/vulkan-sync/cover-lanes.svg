<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">VULKAN</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">EXPLAINED</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">SYNC</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">who waits for whom, and where</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">THREE TOOLS</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="326"><tspan fill="#F04E0F">vkWaitForFences</tspan>        GPU → CPU</tspan>
    <tspan x="76" y="358"><tspan fill="#F04E0F">VkSemaphoreSubmitInfo</tspan>  GPU → GPU</tspan>
    <tspan x="76" y="390"><tspan fill="#FFC23D">vkCmdPipelineBarrier2</tspan>  inside a</tspan>
    <tspan x="76" y="412">                       command buffer</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// plus timeline semaphores and events</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">execution dependency: wait for the work</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">memory dependency: see the data</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">layout transition: arrange the pixels</text>

  <g class="m">
    <text x="640" y="82" font-size="11" fill="#7A7A7A" letter-spacing="2">CPU</text>
    <rect x="640" y="92" width="500" height="60" fill="#1A1A1A"/>
    <line x1="640" y1="122" x2="1140" y2="122" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="14 10"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 230 0; 230 0; 430 0" keyTimes="0;0.3;0.6;1" dur="6s" repeatCount="indefinite"/>
      <rect x="650" y="106" width="56" height="32" fill="#F2F2F2"/>
      <text x="678" y="127" font-size="11" font-weight="700" fill="#141414" text-anchor="middle">CPU</text>
    </g>
    <rect x="950" y="92" width="8" height="60" fill="#F2F2F2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 954 96; 0 954 96; -80 954 96; -80 954 96; 0 954 96" keyTimes="0;0.55;0.6;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect x="954" y="90" width="12" height="62" fill="#F04E0F"/>
    </g>
    <text x="970" y="172" font-size="11" fill="#F04E0F">fence</text>

    <line x1="1000" y1="236" x2="1000" y2="160" stroke="#F04E0F" stroke-width="3" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;22" dur="0.8s" repeatCount="indefinite"/>
    </line>

    <text x="640" y="222" font-size="11" fill="#7A7A7A" letter-spacing="2">QUEUE</text>
    <rect x="640" y="236" width="140" height="70" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="710" y="276" font-size="13" fill="#F2F2F2" text-anchor="middle">acquire</text>
    <rect x="820" y="236" width="180" height="70" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="910" y="276" font-size="13" fill="#F04E0F" text-anchor="middle">submit</text>
    <rect x="1040" y="236" width="100" height="70" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="1090" y="276" font-size="13" fill="#F2F2F2" text-anchor="middle">present</text>
    <circle cy="271" r="8" fill="#F04E0F"><animate attributeName="cx" values="784;816" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="271" r="8" fill="#F04E0F"><animate attributeName="cx" values="1004;1036" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="800" y="330" font-size="11" fill="#F04E0F" text-anchor="middle">semaphore</text>
    <text x="1020" y="330" font-size="11" fill="#F04E0F" text-anchor="middle">semaphore</text>

    <text x="640" y="380" font-size="11" fill="#7A7A7A" letter-spacing="2">INSIDE A COMMAND BUFFER</text>
    <g font-size="10" fill="#7A7A7A" text-anchor="middle">
      <text x="700" y="404">TOP</text><text x="800" y="404">VERTEX</text><text x="900" y="404">FRAGMENT</text><text x="1000" y="404">COLOR</text><text x="1100" y="404">BOTTOM</text>
    </g>
    <g stroke="#2E2E2E" stroke-width="2">
      <line x1="750" y1="412" x2="750" y2="550"/><line x1="850" y1="412" x2="850" y2="550"/><line x1="950" y1="412" x2="950" y2="550"/><line x1="1050" y1="412" x2="1050" y2="550"/>
    </g>
    <circle cy="440" r="15" fill="#F04E0F">
      <animate attributeName="cx" values="700;800;900;1000;1000;1100;1100" keyTimes="0;0.1;0.2;0.3;0.5;0.6;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="445" font-size="11" fill="#F2F2F2" text-anchor="end">A</text>
    <line x1="660" y1="474" x2="1140" y2="474" stroke="#FFC23D" stroke-width="3"/>
    <text x="1140" y="468" font-size="10" font-weight="700" fill="#FFC23D" text-anchor="end">barrier</text>
    <rect x="842" y="490" width="6" height="50" fill="#FF4D4D">
      <animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.5;0.52;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cy="515" r="15" fill="#F2F2F2">
      <animate attributeName="cx" values="700;800;822;822;900;1000;1100;1100" keyTimes="0;0.12;0.16;0.5;0.62;0.74;0.86;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="520" font-size="11" fill="#F2F2F2" text-anchor="end">B</text>
  </g>
</svg>
