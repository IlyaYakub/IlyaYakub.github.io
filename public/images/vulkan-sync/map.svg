<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="420" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="419" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <rect x="30" y="150" width="190" height="110" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="125" y="196" font-size="18" font-weight="700" fill="#F2F2F2" text-anchor="middle">CPU</text>
    <text x="125" y="222" font-size="13" fill="#7A7A7A" text-anchor="middle">your code</text>

    <rect x="270" y="40" width="660" height="330" fill="#0C0C0C" stroke="#7A7A7A" stroke-width="2"/>
    <text x="290" y="68" font-size="14" fill="#7A7A7A" letter-spacing="2">GPU QUEUE</text>

    <rect x="300" y="160" width="120" height="70" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="360" y="200" font-size="15" fill="#F2F2F2" text-anchor="middle">acquire</text>

    <rect x="480" y="100" width="280" height="190" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="496" y="126" font-size="14" fill="#F04E0F">submit</text>
    <text x="744" y="126" font-size="11" fill="#7A7A7A" text-anchor="end">command buffer</text>
    <rect x="500" y="150" width="100" height="110" fill="#141414" stroke="#7A7A7A" stroke-width="2"/>
    <text x="550" y="210" font-size="14" fill="#F2F2F2" text-anchor="middle">clear</text>
    <rect x="640" y="150" width="100" height="110" fill="#141414" stroke="#7A7A7A" stroke-width="2"/>
    <text x="690" y="210" font-size="14" fill="#F2F2F2" text-anchor="middle">draw</text>
    <rect x="612" y="140" width="16" height="130" fill="#FFC23D"/>
    <text x="620" y="284" font-size="12" font-weight="700" fill="#FFC23D" text-anchor="middle">barrier</text>

    <rect x="810" y="160" width="100" height="70" fill="#1A1A1A" stroke="#B0B0B0" stroke-width="2"/>
    <text x="860" y="200" font-size="15" fill="#F2F2F2" text-anchor="middle">present</text>

    <path d="M420 195 H472" stroke="#F04E0F" stroke-width="3"/>
    <path d="M464 188 L474 195 L464 202" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <path d="M760 195 H802" stroke="#F04E0F" stroke-width="3"/>
    <path d="M794 188 L804 195 L794 202" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <circle cx="446" cy="195" r="8" fill="#F04E0F"><animate attributeName="cx" values="424;468" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="195" r="8" fill="#F04E0F"><animate attributeName="cx" values="764;798" dur="1.5s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text x="446" y="160" font-size="12" fill="#F04E0F" text-anchor="middle">sem</text>
    <text x="782" y="160" font-size="12" fill="#F04E0F" text-anchor="middle">sem</text>

    <path d="M620 290 V330 H125 V264" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M118 272 L125 260 L132 272" fill="none" stroke="#F2F2F2" stroke-width="2"/>
    <text x="300" y="352" font-size="13" font-weight="700" fill="#F2F2F2">fence</text>

    <g font-size="13">
      <text x="30" y="306" fill="#F2F2F2">fence:</text>
      <text x="30" y="324" fill="#7A7A7A">GPU → CPU</text>
      <text x="300" y="398" fill="#F04E0F">semaphore: GPU → GPU, between queue operations</text>
      <text x="620" y="68" fill="#FFC23D">barrier: inside a command buffer</text>
    </g>
  </g>
</svg>
