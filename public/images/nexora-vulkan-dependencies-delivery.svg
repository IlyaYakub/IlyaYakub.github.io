<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="belt"><rect x="660" y="200" width="400" height="104"/></clipPath>
    <g id="box3">
      <rect x="0" y="256" width="120" height="44" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
      <text x="60" y="276" font-size="10" fill="#F2F2F2" text-anchor="middle">vulkan-headers</text>
      <text x="60" y="290" font-size="9" fill="#7A7A7A" text-anchor="middle">1.4.357</text>
      <rect x="150" y="256" width="120" height="44" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
      <text x="210" y="276" font-size="10" fill="#F04E0F" text-anchor="middle">vulkan-loader</text>
      <text x="210" y="290" font-size="9" fill="#7A7A7A" text-anchor="middle">1.4.357</text>
      <rect x="300" y="256" width="120" height="44" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
      <text x="360" y="276" font-size="10" fill="#F2F2F2" text-anchor="middle">vk-bootstrap</text>
      <text x="360" y="290" font-size="9" fill="#7A7A7A" text-anchor="middle">1.4.350</text>
    </g>
    <g id="wheel">
      <circle r="18" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="3"/>
      <path d="M-12 0 H12 M0 -12 V12" stroke="#7A7A7A" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#10</text>

  <text class="h" x="56" y="192" font-size="60" fill="#F2F2F2" letter-spacing="-2">DEPENDENCIES</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">Vulkan, delivered by Conan</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">CONFIG/CONANFILE.PY</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">def requirements(self):</tspan>
    <tspan x="76" y="346">    self.requires(<tspan fill="#F04E0F">"vulkan-loader/1.4.357.0"</tspan>)</tspan>
    <tspan x="76" y="370">    self.requires(<tspan fill="#B0B0B0">"vk-bootstrap/1.4.350"</tspan>)</tspan>
    <tspan x="76" y="394">    self.requires(<tspan fill="#B0B0B0">"vulkan-headers/1.4.357.0"</tspan>,</tspan>
    <tspan x="76" y="418">                  override=True)</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// .txt became .py: overrides need code</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">target_link_libraries(NexoraEngineLib PRIVATE</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">    Vulkan::Loader vk-bootstrap::vk-bootstrap)</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// three libraries, one find_package each</text>

  <g class="m">
    <line x1="820" y1="136" x2="820" y2="300" stroke="#F2F2F2" stroke-width="4"/>
    <line x1="900" y1="136" x2="900" y2="300" stroke="#F2F2F2" stroke-width="4"/>
    <rect x="806" y="110" width="108" height="30" fill="#F04E0F"/>
    <text x="860" y="130" font-size="10" font-weight="700" fill="#141414" text-anchor="middle">NX_VULKAN_CHECK</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 72; 0 0" keyTimes="0;0.84;0.92;1" dur="3s" repeatCount="indefinite"/>
      <rect x="854" y="140" width="12" height="40" fill="#B0B0B0"/>
      <rect x="830" y="180" width="60" height="14" fill="#F2F2F2"/>
      <text x="860" y="191" font-size="9" font-weight="700" fill="#141414" text-anchor="middle">CHECK</text>
    </g>

    <g clip-path="url(#belt)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 450 0" dur="9s" repeatCount="indefinite"/>
        <use href="#box3" x="210"/>
        <use href="#box3" x="660"/>
      </g>
    </g>
    <rect x="650" y="300" width="420" height="12" fill="#2E2E2E"/>
    <line x1="650" y1="306" x2="1070" y2="306" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <g fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2">
      <circle cx="670" cy="322" r="8"/><circle cx="760" cy="322" r="8"/><circle cx="860" cy="322" r="8"/><circle cx="960" cy="322" r="8"/><circle cx="1050" cy="322" r="8"/>
    </g>

    <rect x="1070" y="216" width="70" height="96" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="1105" y="252" font-size="9" fill="#F2F2F2" text-anchor="middle">Nexora</text>
    <text x="1105" y="266" font-size="9" fill="#F2F2F2" text-anchor="middle">Engine</text>
    <text x="1105" y="280" font-size="9" fill="#F2F2F2" text-anchor="middle">Lib</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="0.5s" repeatCount="indefinite"/>
      <rect x="650" y="400" width="170" height="96" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
      <text x="735" y="434" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">ConanCenter</text>
      <text x="735" y="454" font-size="10" fill="#7A7A7A" text-anchor="middle">--build=missing</text>
      <rect x="664" y="466" width="142" height="14" fill="#F04E0F"/>
      <polygon points="820,430 870,430 896,462 896,496 820,496" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
      <polygon points="834,440 864,440 882,462 834,462" fill="#0C0C0C" stroke="#7A7A7A" stroke-width="2"/>
    </g>
    <g transform="translate(690 504)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" repeatCount="indefinite"/><use href="#wheel"/></g></g>
    <g transform="translate(860 504)"><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" repeatCount="indefinite"/><use href="#wheel"/></g></g>
    <line x1="640" y1="524" x2="910" y2="524" stroke="#2E2E2E" stroke-width="2"/>
    <path d="M760 400 L700 312" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="4 4"/>

    <rect x="940" y="410" width="200" height="130" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="956" y="434" font-size="10" fill="#7A7A7A" letter-spacing="1">EVERY VkResult</text>
    <text x="956" y="462" font-size="12" fill="#F2F2F2">VK_SUCCESS</text>
    <text x="1124" y="462" font-size="12" fill="#B0B0B0" text-anchor="end">go on</text>
    <text x="956" y="490" font-size="12" fill="#FFC23D">&gt; 0 (suboptimal)</text>
    <text x="1124" y="508" font-size="12" fill="#B0B0B0" text-anchor="end">go on</text>
    <text x="956" y="528" font-size="12" fill="#FF4D4D">&lt; 0</text>
    <text x="1124" y="528" font-size="12" font-weight="700" fill="#F04E0F" text-anchor="end">Fatal</text>
  </g>
</svg>
