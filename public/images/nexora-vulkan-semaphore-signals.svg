<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <pattern id="arm" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#F04E0F"/>
      <rect x="10" width="10" height="12" fill="#F2F2F2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#15</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">SEMAPHORE</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">signals between GPU stations</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">VKSEMAPHORESUBMITINFO</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">.semaphore = <tspan fill="#F04E0F">imageAvailable</tspan></tspan>
    <tspan x="76" y="346">.stageMask = <tspan fill="#B0B0B0">COLOR_ATTACHMENT_OUTPUT</tspan></tspan>
    <tspan x="76" y="382">.semaphore = <tspan fill="#F04E0F">renderFinished</tspan></tspan>
    <tspan x="76" y="406">.stageMask = <tspan fill="#B0B0B0">ALL_COMMANDS</tspan></tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// no wait() or reset(): the CPU never touches it</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">VulkanSemaphore(device)</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">vkCreateSemaphore(device, &amp;info, nullptr, &amp;m_semaphore);</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// binary: GPU signals, GPU waits</text>

  <g class="m">
    <text x="890" y="88" font-size="12" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">ONE FRAME, THREE STATIONS</text>

    <g font-size="12" font-weight="700" text-anchor="middle">
      <polygon points="650,330 715,306 780,330" fill="#2E2E2E"/>
      <rect x="656" y="330" width="118" height="40" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
      <text x="715" y="355" fill="#F2F2F2">ACQUIRE</text>
      <polygon points="842,330 907,306 972,330" fill="#2E2E2E"/>
      <rect x="848" y="330" width="118" height="40" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
      <text x="907" y="355" fill="#F04E0F">RENDER</text>
      <polygon points="1024,330 1082,306 1140,330" fill="#2E2E2E"/>
      <rect x="1030" y="330" width="104" height="40" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
      <text x="1082" y="355" fill="#F2F2F2">PRESENT</text>
    </g>

    <g stroke="#3A3A3A" stroke-width="6">
      <line x1="650" y1="408" x2="650" y2="432"/><line x1="680" y1="408" x2="680" y2="432"/><line x1="710" y1="408" x2="710" y2="432"/><line x1="740" y1="408" x2="740" y2="432"/>
      <line x1="770" y1="408" x2="770" y2="432"/><line x1="800" y1="408" x2="800" y2="432"/><line x1="830" y1="408" x2="830" y2="432"/><line x1="860" y1="408" x2="860" y2="432"/>
      <line x1="890" y1="408" x2="890" y2="432"/><line x1="920" y1="408" x2="920" y2="432"/><line x1="950" y1="408" x2="950" y2="432"/><line x1="980" y1="408" x2="980" y2="432"/>
      <line x1="1010" y1="408" x2="1010" y2="432"/><line x1="1040" y1="408" x2="1040" y2="432"/><line x1="1070" y1="408" x2="1070" y2="432"/><line x1="1100" y1="408" x2="1100" y2="432"/><line x1="1130" y1="408" x2="1130" y2="432"/>
    </g>
    <line x1="640" y1="412" x2="1140" y2="412" stroke="#B0B0B0" stroke-width="3"/>
    <line x1="640" y1="428" x2="1140" y2="428" stroke="#B0B0B0" stroke-width="3"/>

    <rect x="806" y="230" width="8" height="182" fill="#F2F2F2"/>
    <circle cx="810" cy="300" r="7" fill="#FF4D4D">
      <animate attributeName="fill" values="#FF4D4D;#FF4D4D;#4DD08A;#4DD08A;#FF4D4D" keyTimes="0;0.13;0.15;0.33;0.35" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 810 244; 0 810 244; -45 810 244; -45 810 244; 0 810 244; 0 810 244" keyTimes="0;0.12;0.15;0.32;0.35;1" dur="6s" repeatCount="indefinite"/>
      <rect x="810" y="238" width="70" height="12" fill="url(#arm)" stroke="#141414"/>
    </g>
    <circle cx="810" cy="244" r="6" fill="#7A7A7A"/>
    <text x="810" y="196" font-size="11" fill="#F04E0F" text-anchor="middle">image available</text>
    <text x="810" y="212" font-size="9" fill="#7A7A7A" text-anchor="middle">per frame in flight</text>

    <rect x="996" y="230" width="8" height="182" fill="#F2F2F2"/>
    <circle cx="1000" cy="300" r="7" fill="#FF4D4D">
      <animate attributeName="fill" values="#FF4D4D;#FF4D4D;#4DD08A;#4DD08A;#FF4D4D" keyTimes="0;0.48;0.5;0.68;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1000 244; 0 1000 244; -45 1000 244; -45 1000 244; 0 1000 244; 0 1000 244" keyTimes="0;0.47;0.5;0.67;0.7;1" dur="6s" repeatCount="indefinite"/>
      <rect x="1000" y="238" width="70" height="12" fill="url(#arm)" stroke="#141414"/>
    </g>
    <circle cx="1000" cy="244" r="6" fill="#7A7A7A"/>
    <text x="1000" y="196" font-size="11" fill="#F04E0F" text-anchor="middle">render finished</text>
    <text x="1000" y="212" font-size="9" fill="#7A7A7A" text-anchor="middle">per swapchain image</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 192 0; 192 0; 367 0; 367 0" keyTimes="0;0.15;0.32;0.5;0.67;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.88;0.93;0.97;1" dur="6s" repeatCount="indefinite"/>
      <rect x="670" y="378" width="90" height="32" fill="#F04E0F"/>
      <rect x="742" y="366" width="14" height="12" fill="#F04E0F"/>
      <rect x="680" y="384" width="18" height="12" fill="#141414"/>
      <rect x="704" y="384" width="18" height="12" fill="#141414"/>
      <text x="740" y="404" font-size="9" font-weight="700" fill="#141414" text-anchor="middle">frame</text>
      <circle cx="686" cy="412" r="6" fill="#F2F2F2"/>
      <circle cx="744" cy="412" r="6" fill="#F2F2F2"/>
    </g>

    <text x="640" y="470" font-size="11" fill="#7A7A7A" letter-spacing="2">BINARY SEMAPHORES</text>
    <text x="640" y="492" font-size="12" fill="#F2F2F2">the GPU raises the arm, the GPU waits for it</text>
    <text x="640" y="512" font-size="12" fill="#F2F2F2">vkQueueSubmit2 and vkQueuePresentKHR return at once</text>
    <text x="640" y="532" font-size="12" fill="#F04E0F">the CPU never stands at these signals</text>
  </g>
</svg>
