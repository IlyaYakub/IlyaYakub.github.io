<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text x="108" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#13</text>

  <text x="56" y="192" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#F2F2F2" letter-spacing="-3">QUEUE</text>
  <text x="60" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">where work reaches the GPU</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VULKANVIEWPORT::ENDFRAME</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">graphicsQueue.<tspan fill="#F04E0F">submit</tspan>(</tspan>
    <tspan x="76" y="346">    commandBuffer, imageAvailable,</tspan>
    <tspan x="76" y="370">    renderFinished, inFlightFence);</tspan>
    <tspan x="76" y="394">graphicsQueue.<tspan fill="#F04E0F">present</tspan>(</tspan>
    <tspan x="76" y="418">    swapchain, imageIndex, renderFinished);</tspan>
  </text>
  <text x="76" y="446" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// one graphics queue, family with GRAPHICS_BIT</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">VulkanQueue(device, familyIndex)</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">vkGetDeviceQueue(device, familyIndex, 0, &amp;m_queue);</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">// owned by the device: no destructor</text>

  <text x="860" y="70" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle">VkQueue</text>

  <rect x="660" y="100" width="400" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
  <text x="680" y="128" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#F2F2F2">Command buffer</text>
  <text x="680" y="150" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#7A7A7A">recorded on the CPU</text>

  <line x1="860" y1="164" x2="860" y2="208" stroke="#F04E0F" stroke-width="4"/>
  <path d="M852 200 L860 210 L868 200" fill="none" stroke="#F04E0F" stroke-width="3"/>
  <text x="878" y="192" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#F04E0F">vkQueueSubmit2</text>

  <rect x="660" y="214" width="400" height="64" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
  <text x="680" y="242" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#F04E0F">GPU</text>
  <text x="680" y="264" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#7A7A7A">wait imageAvailable @ color output</text>

  <path d="M1060 246 H1100 V132 H1066" fill="none" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M1074 126 L1064 132 L1074 138" fill="none" stroke="#7A7A7A" stroke-width="2"/>
  <text x="1108" y="194" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#7A7A7A">fence</text>

  <line x1="860" y1="278" x2="860" y2="322" stroke="#F04E0F" stroke-width="4"/>
  <path d="M852 314 L860 324 L868 314" fill="none" stroke="#F04E0F" stroke-width="3"/>
  <text x="878" y="306" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#B0B0B0">signal renderFinished</text>

  <rect x="660" y="328" width="400" height="64" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
  <text x="680" y="356" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#F2F2F2">Swapchain image</text>
  <text x="680" y="378" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#7A7A7A">imageIndex</text>

  <line x1="860" y1="392" x2="860" y2="436" stroke="#F04E0F" stroke-width="4"/>
  <path d="M852 428 L860 438 L868 428" fill="none" stroke="#F04E0F" stroke-width="3"/>
  <text x="878" y="420" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#F04E0F">vkQueuePresentKHR</text>

  <rect x="660" y="442" width="400" height="64" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
  <text x="680" y="470" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#F2F2F2">Window</text>
  <text x="680" y="492" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#FFC23D">OUT_OF_DATE -&gt; recreate on next acquire</text>
</svg>
