  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#4</text>

  <text x="56" y="200" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="900" fill="#F2F2F2" letter-spacing="-3">WINDOW</text>
  <text x="60" y="246" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">GLFW · Vulkan-ready</text>

  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#F2F2F2" xml:space="preserve">
    <tspan x="60" y="330">WindowSettings{</tspan>
    <tspan x="60" y="362"><tspan fill="#7A7A7A">    .title  = </tspan>"Nexora",</tspan>
    <tspan x="60" y="394"><tspan fill="#7A7A7A">    .width  = </tspan><tspan fill="#F04E0F">1280</tspan>,</tspan>
    <tspan x="60" y="426"><tspan fill="#7A7A7A">    .height = </tspan><tspan fill="#F04E0F">720</tspan>,</tspan>
    <tspan x="60" y="458">}</tspan>
  </text>

  <text x="60" y="540" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#7A7A7A">glfwWindowHint(GLFW_CLIENT_API, <tspan fill="#F2F2F2">GLFW_NO_API</tspan>);</text>
  <text x="60" y="566" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#7A7A7A">// no OpenGL context: Vulkan draws here later</text>

