  <text x="1134" y="237.5" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F04E0F" text-anchor="middle" transform="rotate(90 1134 237.5)" dy="5">720</text>

  <text x="540" y="499" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">RAII: glfwCreateWindow() in the constructor,</text>
  <text x="540" y="523" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">glfwDestroyWindow() in the destructor</text>
