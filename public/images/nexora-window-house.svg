<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <pattern id="bricks" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#171717"/>
      <path d="M0 0.5 H60 M0 15.5 H60 M0.5 0 V15 M30.5 15 V30" stroke="#222" stroke-width="2"/>
    </pattern>
    <clipPath id="glass"><rect x="744" y="160" width="292" height="272"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="640" y="60" width="500" height="500" fill="url(#bricks)"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#4</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">WINDOW</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">a GLFW window behind an interface</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">WINDOW/IWINDOW.H</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">class <tspan fill="#F04E0F">IWindow</tspan> : public NonCopyable</tspan>
    <tspan x="76" y="346">    virtual bool  shouldClose() const = 0;</tspan>
    <tspan x="76" y="370">    virtual int32 width() const       = 0;</tspan>
    <tspan x="76" y="394">    virtual int32 height() const      = 0;</tspan>
    <tspan x="76" y="418">class <tspan fill="#F04E0F">GLFWWindow</tspan> final : public IWindow</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// GLFW types never leak into the header</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">glfwWindowHint(GLFW_CLIENT_API, GLFW_NO_API);</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">glfwCreateWindow(1280, 720, "Nexora", ...);</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// no OpenGL context: Vulkan draws later</text>

  <g class="m">
    <rect x="712" y="96" width="356" height="368" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="4"/>
    <rect x="728" y="112" width="324" height="40" fill="#F04E0F"/>
    <text x="744" y="137" font-size="14" font-weight="700" fill="#141414">Nexora</text>
    <text x="868" y="137" font-size="12" fill="#141414">1280 × 720</text>
    <rect x="990" y="124" width="14" height="14" fill="none" stroke="#141414" stroke-width="2"/>
    <path d="M1018 124 l14 14 m0 -14 l-14 14" stroke="#141414" stroke-width="2"/>

    <rect x="744" y="160" width="292" height="272" fill="#0A0A0A"/>
    <g clip-path="url(#glass)">
      <circle cx="960" cy="214" r="26" fill="#F2F2F2"/>
      <circle cx="972" cy="206" r="24" fill="#0A0A0A"/>
      <circle cx="790" cy="190" r="2" fill="#F2F2F2"/>
      <circle cx="830" cy="230" r="1.5" fill="#B0B0B0"/>
      <circle cx="880" cy="180" r="2" fill="#F2F2F2">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="280" r="1.5" fill="#B0B0B0">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="300" r="1.5" fill="#B0B0B0"/>
      <g fill="#2E2E2E">
        <animateTransform attributeName="transform" type="translate" values="-180 0; 340 0" dur="14s" repeatCount="indefinite"/>
        <ellipse cx="780" cy="260" rx="46" ry="16"/>
        <ellipse cx="810" cy="248" rx="30" ry="16"/>
        <ellipse cx="756" cy="252" rx="22" ry="12"/>
      </g>
      <text x="890" y="370" font-size="12" fill="#7A7A7A" text-anchor="middle">GLFW_NO_API</text>
      <text x="890" y="388" font-size="11" fill="#2E2E2E" text-anchor="middle">nothing drawn here yet</text>
    </g>
    <line x1="890" y1="160" x2="890" y2="432" stroke="#F2F2F2" stroke-width="6"/>
    <line x1="744" y1="300" x2="1036" y2="300" stroke="#F2F2F2" stroke-width="6"/>
    <rect x="744" y="160" width="292" height="272" fill="none" stroke="#F2F2F2" stroke-width="3"/>

    <rect x="696" y="464" width="388" height="14" fill="#F2F2F2"/>
    <polygon points="752,464 760,436 796,436 804,464" fill="#F04E0F"/>
    <path d="M778 436 C770 416 756 410 750 398 M778 436 C784 414 800 408 806 394 M778 436 V400" fill="none" stroke="#7A7A7A" stroke-width="3"/>
    <circle cx="778" cy="398" r="6" fill="#F04E0F"/>

    <rect x="852" y="494" width="236" height="40" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="970" y="512" font-size="11" fill="#F04E0F" text-anchor="middle">GLFWWindow final</text>
    <text x="970" y="526" font-size="10" fill="#B0B0B0" text-anchor="middle">: public IWindow</text>
    <circle cx="862" cy="514" r="2.5" fill="#7A7A7A"/>
    <circle cx="1078" cy="514" r="2.5" fill="#7A7A7A"/>
  </g>
</svg>
