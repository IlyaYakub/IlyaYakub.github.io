<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#1</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">ENGINE CORE</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">log · event · window, turning together</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">ENGINE::RUN()</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">while (!m_windowManager-&gt;<tspan fill="#F04E0F">areAllWindowsClosed</tspan>())</tspan>
    <tspan x="76" y="346">{</tspan>
    <tspan x="76" y="370">    m_timer-&gt;<tspan fill="#F04E0F">tick</tspan>();</tspan>
    <tspan x="76" y="394">    m_windowManager-&gt;<tspan fill="#F04E0F">update</tspan>();</tspan>
    <tspan x="76" y="418">    m_renderer-&gt;<tspan fill="#F04E0F">render</tspan>();</tspan>
    <tspan x="76" y="442">}</tspan>
  </text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">NX_LOG(LogEngine, Display, "Nexora {}", version);</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">window-&gt;windowEvent().add(this, &amp;Engine::onWindowEvent);</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// modules talk through events, not to each other</text>

  <g class="m">
    <g transform="rotate(0 790 330)">
      <g>
        <circle cx="790" cy="330" r="92" fill="none" stroke="#F2F2F2" stroke-width="16" stroke-dasharray="20.645 20.645"/>
        <circle cx="790" cy="330" r="84" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
        <circle cx="790" cy="330" r="62" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 790 330" to="360 790 330" dur="14.00s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="790" y="332" font-size="16" font-weight="700" fill="#F2F2F2" text-anchor="middle">LOG</text>
    <text x="790" y="350" font-size="10" fill="#7A7A7A" text-anchor="middle">NX_LOG</text>
    <g transform="rotate(9 946 270)">
      <g>
        <circle cx="946" cy="270" r="64" fill="none" stroke="#F04E0F" stroke-width="16" stroke-dasharray="20.106 20.106"/>
        <circle cx="946" cy="270" r="56" fill="#1A1A1A" stroke="#F04E0F" stroke-width="3"/>
        <circle cx="946" cy="270" r="34" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 946 270" to="-360 946 270" dur="9.74s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="946" y="272" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">EVENT</text>
    <text x="946" y="290" font-size="10" fill="#7A7A7A" text-anchor="middle">add · invoke</text>
    <g transform="rotate(4 1040 410)">
      <g>
        <circle cx="1040" cy="410" r="72" fill="none" stroke="#F2F2F2" stroke-width="16" stroke-dasharray="20.563 20.563"/>
        <circle cx="1040" cy="410" r="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="3"/>
        <circle cx="1040" cy="410" r="42" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1040 410" to="360 1040 410" dur="10.96s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="1040" y="412" font-size="16" font-weight="700" fill="#F2F2F2" text-anchor="middle">WINDOW</text>
    <text x="1040" y="430" font-size="10" fill="#7A7A7A" text-anchor="middle">InputEvent</text>

    <g font-size="11" fill="#7A7A7A">
      <text x="690" y="490">[Display] Nexora 0.1
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="690" y="512" fill="#F04E0F">[Display] Resize: 1600x900
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>
    <line x1="680" y1="546" x2="1130" y2="546" stroke="#2E2E2E" stroke-width="2"/>
    <text x="1130" y="568" font-size="11" fill="#7A7A7A" text-anchor="end">one frame = one turn</text>
  </g>
</svg>
