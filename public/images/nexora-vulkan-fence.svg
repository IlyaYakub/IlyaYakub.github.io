<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text x="108" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#14</text>

  <text x="56" y="192" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#F2F2F2" letter-spacing="-3">FENCE</text>
  <text x="60" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">the CPU waits for the GPU</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VULKANVIEWPORT::BEGINFRAME</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">inFlightFence.<tspan fill="#F04E0F">wait</tspan>();</tspan>
    <tspan x="76" y="346">setImageIndex(acquireNextImage(...));</tspan>
    <tspan x="76" y="370">inFlightFence.<tspan fill="#F04E0F">reset</tspan>();</tspan>
    <tspan x="76" y="394"><tspan fill="#7A7A7A">...</tspan></tspan>
    <tspan x="76" y="418">queue.submit(..., <tspan fill="#F04E0F">inFlightFence</tspan>);</tspan>
  </text>
  <text x="76" y="446" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// one fence per frame in flight</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">VkFenceCreateInfo</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">.flags = VK_FENCE_CREATE_SIGNALED_BIT</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">// so the first wait() passes at once</text>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <text x="890" y="64" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle">2 FRAMES IN FLIGHT</text>

    <text x="640" y="118" font-size="12" fill="#7A7A7A" letter-spacing="2">CPU</text>
    <line x1="640" y1="170" x2="1140" y2="170" stroke="#2E2E2E" stroke-width="1"/>
    <rect x="640" y="132" width="110" height="38" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="695" y="156" font-size="13" fill="#F2F2F2" text-anchor="middle">record 0</text>
    <rect x="760" y="132" width="110" height="38" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="815" y="156" font-size="13" fill="#B0B0B0" text-anchor="middle">record 1</text>
    <rect x="880" y="132" width="40" height="38" fill="none" stroke="#F04E0F" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="900" y="156" font-size="11" fill="#F04E0F" text-anchor="middle">wait</text>
    <rect x="930" y="132" width="110" height="38" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="985" y="156" font-size="13" fill="#F2F2F2" text-anchor="middle">record 0</text>
    <rect x="1050" y="132" width="90" height="38" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="1095" y="156" font-size="13" fill="#B0B0B0" text-anchor="middle">record 1</text>

    <text x="640" y="236" font-size="12" fill="#7A7A7A" letter-spacing="2">GPU</text>
    <rect x="752" y="250" width="166" height="38" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="835" y="274" font-size="13" fill="#F2F2F2" text-anchor="middle">draw 0</text>
    <rect x="920" y="250" width="166" height="38" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="1003" y="274" font-size="13" fill="#B0B0B0" text-anchor="middle">draw 1</text>

    <path d="M750 170 L750 248" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="700" y="214" font-size="11" fill="#7A7A7A">submit</text>

    <path d="M918 250 L918 178" stroke="#F04E0F" stroke-width="3"/>
    <path d="M911 186 L918 176 L925 186" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <circle cx="918" cy="269" r="6" fill="#F04E0F"/>
    <text x="930" y="216" font-size="12" font-weight="700" fill="#F04E0F">signal fence 0</text>

    <text x="640" y="356" font-size="12" fill="#7A7A7A" letter-spacing="2">VKFENCE STATES</text>

    <rect x="640" y="376" width="220" height="74" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <circle cx="668" cy="413" r="10" fill="#F04E0F"/>
    <text x="690" y="410" font-size="15" font-weight="700" fill="#F04E0F">signaled</text>
    <text x="690" y="430" font-size="11" fill="#7A7A7A">wait() passes</text>

    <rect x="920" y="376" width="220" height="74" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <circle cx="948" cy="413" r="10" fill="none" stroke="#7A7A7A" stroke-width="2.5"/>
    <text x="970" y="410" font-size="15" font-weight="700" fill="#F2F2F2">unsignaled</text>
    <text x="970" y="430" font-size="11" fill="#7A7A7A">wait() blocks</text>

    <path d="M860 396 H912" stroke="#F2F2F2" stroke-width="2"/>
    <path d="M904 390 L914 396 L904 402" fill="none" stroke="#F2F2F2" stroke-width="2"/>
    <text x="890" y="388" font-size="11" fill="#F2F2F2" text-anchor="middle">reset</text>
    <path d="M920 432 H868" stroke="#F04E0F" stroke-width="2"/>
    <path d="M876 426 L866 432 L876 438" fill="none" stroke="#F04E0F" stroke-width="2"/>
    <text x="890" y="452" font-size="11" fill="#F04E0F" text-anchor="middle">GPU done</text>

    <rect x="640" y="484" width="500" height="60" fill="#0C0C0C" stroke="#2E2E2E"/>
    <text x="656" y="508" font-size="12" fill="#7A7A7A">vkWaitForFences(device, 1, &amp;fence,</text>
    <text x="656" y="528" font-size="12" fill="#F2F2F2">                VK_TRUE, <tspan fill="#F04E0F">UINT64_MAX</tspan>);</text>
  </g>
</svg>
