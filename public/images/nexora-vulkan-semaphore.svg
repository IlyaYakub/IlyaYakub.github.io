<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text x="108" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#15</text>

  <text x="56" y="192" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#F2F2F2" letter-spacing="-3">SEMAPHORE</text>
  <text x="60" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">the GPU waits for itself</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VKSEMAPHORESUBMITINFO</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">.semaphore = <tspan fill="#F04E0F">imageAvailable</tspan></tspan>
    <tspan x="76" y="346">.stageMask =</tspan>
    <tspan x="76" y="370">    <tspan fill="#B0B0B0">COLOR_ATTACHMENT_OUTPUT</tspan></tspan>
    <tspan x="76" y="406">.semaphore = <tspan fill="#F04E0F">renderFinished</tspan></tspan>
    <tspan x="76" y="430">.stageMask = <tspan fill="#B0B0B0">ALL_COMMANDS</tspan></tspan>
  </text>
  <text x="76" y="452" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// no wait() or reset(): the CPU never touches it</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">VulkanSemaphore(device)</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">vkCreateSemaphore(device, &amp;info, nullptr, &amp;m_semaphore);</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">// binary: GPU signals, GPU waits</text>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <text x="890" y="64" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle">ONE FRAME ON THE GPU</text>

    <rect x="640" y="96" width="140" height="70" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
    <text x="710" y="128" font-size="15" font-weight="700" fill="#F2F2F2" text-anchor="middle">Acquire</text>
    <text x="710" y="148" font-size="11" fill="#7A7A7A" text-anchor="middle">swapchain image</text>

    <rect x="820" y="96" width="140" height="70" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="890" y="128" font-size="15" font-weight="700" fill="#F04E0F" text-anchor="middle">Render</text>
    <text x="890" y="148" font-size="11" fill="#7A7A7A" text-anchor="middle">vkQueueSubmit2</text>

    <rect x="1000" y="96" width="140" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="1070" y="128" font-size="15" font-weight="700" fill="#F2F2F2" text-anchor="middle">Present</text>
    <text x="1070" y="148" font-size="11" fill="#7A7A7A" text-anchor="middle">to the window</text>

    <path d="M780 131 H812" stroke="#F04E0F" stroke-width="3"/>
    <path d="M806 125 L814 131 L806 137" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <circle cx="800" cy="196" r="9" fill="#F04E0F"/>
    <line x1="800" y1="166" x2="800" y2="187" stroke="#F04E0F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="800" y="224" font-size="11" fill="#F04E0F" text-anchor="middle">image</text>
    <text x="800" y="238" font-size="11" fill="#F04E0F" text-anchor="middle">available</text>

    <path d="M960 131 H992" stroke="#F04E0F" stroke-width="3"/>
    <path d="M986 125 L994 131 L986 137" fill="none" stroke="#F04E0F" stroke-width="3"/>
    <circle cx="980" cy="196" r="9" fill="#F04E0F"/>
    <line x1="980" y1="166" x2="980" y2="187" stroke="#F04E0F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="980" y="224" font-size="11" fill="#F04E0F" text-anchor="middle">render</text>
    <text x="980" y="238" font-size="11" fill="#F04E0F" text-anchor="middle">finished</text>

    <text x="640" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">IMAGE AVAILABLE · PER FRAME IN FLIGHT</text>
    <rect x="640" y="304" width="160" height="56" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <circle cx="664" cy="332" r="8" fill="#F04E0F"/>
    <text x="682" y="337" font-size="14" fill="#F2F2F2">frame 0</text>
    <rect x="812" y="304" width="160" height="56" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="2"/>
    <circle cx="836" cy="332" r="8" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <text x="854" y="337" font-size="14" fill="#B0B0B0">frame 1</text>
    <text x="988" y="328" font-size="11" fill="#7A7A7A">reused after</text>
    <text x="988" y="344" font-size="11" fill="#7A7A7A">fence.wait()</text>

    <text x="640" y="410" font-size="12" fill="#7A7A7A" letter-spacing="2">RENDER FINISHED · PER SWAPCHAIN IMAGE</text>
    <rect x="640" y="424" width="116" height="56" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="2"/>
    <circle cx="662" cy="452" r="8" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <text x="678" y="457" font-size="14" fill="#B0B0B0">img 0</text>
    <rect x="768" y="424" width="116" height="56" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <circle cx="790" cy="452" r="8" fill="#F04E0F"/>
    <text x="806" y="457" font-size="14" fill="#F2F2F2">img 1</text>
    <rect x="896" y="424" width="116" height="56" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="2"/>
    <circle cx="918" cy="452" r="8" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <text x="934" y="457" font-size="14" fill="#B0B0B0">img 2</text>
    <text x="1028" y="448" font-size="11" fill="#7A7A7A">reused when</text>
    <text x="1028" y="464" font-size="11" fill="#7A7A7A">image is</text>
    <text x="1028" y="480" font-size="11" fill="#7A7A7A">acquired again</text>

    <rect x="640" y="512" width="500" height="44" fill="#0C0C0C" stroke="#2E2E2E"/>
    <text x="656" y="539" font-size="12" fill="#F2F2F2">m_renderFinishedSemaphores[<tspan fill="#F04E0F">m_imageIndex</tspan>]</text>
  </g>
</svg>
