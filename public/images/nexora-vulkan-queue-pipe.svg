<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <clipPath id="pipe">
      <rect x="652" y="236" width="436" height="52"/>
    </clipPath>
    <clipPath id="funnel">
      <polygon points="652,92 744,92 712,226 684,226"/>
    </clipPath>
    <g id="cmd">
      <rect x="0" y="0" width="58" height="34" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
      <line x1="8" y1="10" x2="40" y2="10" stroke="#7A7A7A" stroke-width="2"/>
      <line x1="8" y1="17" x2="48" y2="17" stroke="#F04E0F" stroke-width="2"/>
      <line x1="8" y1="24" x2="32" y2="24" stroke="#7A7A7A" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text x="108" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#13</text>

  <text x="56" y="192" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#F2F2F2" letter-spacing="-3">QUEUE</text>
  <text x="60" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">the pipe from the CPU to the GPU</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VULKANVIEWPORT::ENDFRAME</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">graphicsQueue.<tspan fill="#F04E0F">submit</tspan>(</tspan>
    <tspan x="76" y="346">    commandBuffer, imageAvailable,</tspan>
    <tspan x="76" y="370">    renderFinished, inFlightFence);</tspan>
    <tspan x="76" y="394">graphicsQueue.<tspan fill="#F04E0F">present</tspan>(</tspan>
    <tspan x="76" y="418">    swapchain, imageIndex, renderFinished);</tspan>
  </text>
  <text x="76" y="446" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// one graphics queue, family with GRAPHICS_BIT</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">VulkanQueue(device, familyIndex)</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">vkGetDeviceQueue(device, familyIndex, 0, &amp;m_queue);</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">// owned by the device: no destructor</text>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <text x="760" y="74" font-size="12" fill="#7A7A7A" letter-spacing="2">CPU</text>
    <text x="760" y="92" font-size="13" font-weight="700" fill="#F04E0F">vkQueueSubmit2</text>

    <polygon points="652,92 744,92 712,226 684,226" fill="#0C0C0C"/>
    <g clip-path="url(#funnel)">
      <use href="#cmd" x="669" y="60">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 150" dur="2s" repeatCount="indefinite"/>
      </use>
    </g>
    <polyline points="652,92 684,226 684,236" fill="none" stroke="#F2F2F2" stroke-width="3"/>
    <polyline points="744,92 712,226 712,236" fill="none" stroke="#F2F2F2" stroke-width="3"/>

    <rect x="652" y="236" width="436" height="52" fill="#0C0C0C"/>
    <g clip-path="url(#pipe)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 100 0" dur="2s" repeatCount="indefinite"/>
        <use href="#cmd" x="560" y="245"/>
        <use href="#cmd" x="660" y="245"/>
        <use href="#cmd" x="760" y="245"/>
        <use href="#cmd" x="860" y="245"/>
        <use href="#cmd" x="960" y="245"/>
        <use href="#cmd" x="1060" y="245"/>
      </g>
    </g>
    <line x1="640" y1="232" x2="684" y2="232" stroke="#F2F2F2" stroke-width="8"/>
    <line x1="712" y1="232" x2="1100" y2="232" stroke="#F2F2F2" stroke-width="8"/>
    <line x1="640" y1="292" x2="1050" y2="292" stroke="#F2F2F2" stroke-width="8"/>
    <line x1="644" y1="228" x2="644" y2="296" stroke="#F2F2F2" stroke-width="8"/>
    <rect x="770" y="222" width="14" height="80" fill="#2E2E2E" stroke="#7A7A7A" stroke-width="2"/>
    <rect x="980" y="222" width="14" height="80" fill="#2E2E2E" stroke="#7A7A7A" stroke-width="2"/>

    <path d="M1050 292 V336" stroke="#F2F2F2" stroke-width="8" fill="none"/>
    <path d="M1100 232 V336" stroke="#F2F2F2" stroke-width="8" fill="none"/>
    <rect x="1054" y="236" width="42" height="100" fill="#0C0C0C"/>
    <text x="1120" y="270" font-size="11" fill="#7A7A7A">in</text>
    <text x="1120" y="284" font-size="11" fill="#7A7A7A">order</text>

    <line x1="880" y1="228" x2="880" y2="196" stroke="#7A7A7A" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 880 180; 360 880 180" dur="4s" repeatCount="indefinite"/>
      <circle cx="880" cy="180" r="24" fill="none" stroke="#F04E0F" stroke-width="5"/>
      <line x1="856" y1="180" x2="904" y2="180" stroke="#F04E0F" stroke-width="3"/>
      <line x1="880" y1="156" x2="880" y2="204" stroke="#F04E0F" stroke-width="3"/>
    </g>
    <circle cx="880" cy="180" r="5" fill="#F2F2F2"/>
    <text x="914" y="174" font-size="11" fill="#F04E0F">semaphore</text>
    <text x="914" y="190" font-size="11" fill="#7A7A7A">wait image available</text>

    <rect x="980" y="340" width="160" height="96" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="996" y="364" font-size="14" font-weight="700" fill="#F04E0F">GPU</text>
    <text x="996" y="382" font-size="10" fill="#7A7A7A">runs the commands</text>
    <circle cx="1104" cy="408" r="20" fill="none" stroke="#7A7A7A" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1104 408; 360 1104 408" dur="0.8s" repeatCount="indefinite"/>
      <path d="M1104 408 L1104 390 Q1114 396 1104 408 L1122 408 Q1116 418 1104 408 L1104 426 Q1094 420 1104 408 L1086 408 Q1092 398 1104 408 Z" fill="#7A7A7A"/>
    </g>
    <rect x="996" y="396" width="60" height="26" fill="none" stroke="#2E2E2E" stroke-width="2"/>
    <line x1="1004" y1="404" x2="1048" y2="404" stroke="#F04E0F" stroke-width="2">
      <animate attributeName="x2" values="1004;1048;1004" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="1004" y1="414" x2="1036" y2="414" stroke="#2E2E2E" stroke-width="2"/>

    <circle cx="960" cy="388" r="9" fill="#F04E0F">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M951 388 H660 V320" fill="none" stroke="#F04E0F" stroke-width="2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M654 328 L660 318 L666 328" fill="none" stroke="#F04E0F" stroke-width="2"/>
    <text x="676" y="376" font-size="11" fill="#F04E0F">fence: frame is free again</text>

    <path d="M1060 436 V474" stroke="#F2F2F2" stroke-width="2"/>
    <path d="M1054 466 L1060 476 L1066 466" fill="none" stroke="#F2F2F2" stroke-width="2"/>
    <text x="1052" y="460" font-size="10" font-weight="700" fill="#F2F2F2" text-anchor="end">vkQueuePresentKHR</text>
    <text x="1052" y="474" font-size="10" fill="#7A7A7A" text-anchor="end">wait render finished</text>

    <rect x="1000" y="480" width="120" height="66" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="3"/>
    <rect x="1008" y="488" width="104" height="50" fill="#F04E0F">
      <animate attributeName="opacity" values="0.2;0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="1060" y="518" font-size="12" font-weight="700" fill="#F2F2F2" text-anchor="middle">frame</text>
    <rect x="1050" y="546" width="20" height="10" fill="#7A7A7A"/>
    <rect x="1036" y="556" width="48" height="4" fill="#7A7A7A"/>

    <text x="660" y="440" font-size="11" fill="#7A7A7A" letter-spacing="2">ONE GRAPHICS QUEUE</text>
    <text x="660" y="460" font-size="11" fill="#7A7A7A">submitted work runs in order,</text>
    <text x="660" y="476" font-size="11" fill="#7A7A7A">the CPU never waits on submit</text>
    <text x="660" y="520" font-size="11" fill="#7A7A7A">OUT_OF_DATE on present:</text>
    <text x="660" y="536" font-size="11" fill="#FFC23D">recreate on next acquire</text>
  </g>
</svg>
