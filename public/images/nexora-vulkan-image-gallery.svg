<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="lens"><circle cx="1000" cy="330" r="40"/></clipPath>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC23D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFC23D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#18</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">IMAGE</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">a canvas, a lens and a state tag</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">~VULKANIMAGE</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">vkDestroyImageView(logicalDevice, <tspan fill="#F04E0F">m_view</tspan>, ...);</tspan>
    <tspan x="76" y="346">if (m_type != VulkanImageType::<tspan fill="#F04E0F">Swapchain</tspan>)</tspan>
    <tspan x="76" y="370">{</tspan>
    <tspan x="76" y="394">    vkDestroyImage(logicalDevice, m_image, ...);</tspan>
    <tspan x="76" y="418">}</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// swapchain images are borrowed, views are ours</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">class VulkanImage final : public IRHITexture</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">enum class VulkanResourceState { Unknown, ColorAttachment, Present };</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// the old state is needed to build a barrier</text>

  <g class="m">
    <rect x="640" y="70" width="500" height="160" fill="#171717"/>
    <text x="890" y="88" font-size="10" fill="#7A7A7A" text-anchor="middle" letter-spacing="2">SWAPCHAIN WING</text>

    <polygon points="700,96 740,96 790,230 650,230" fill="url(#spot)">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <rect x="660" y="112" width="120" height="84" fill="#0C0C0C" stroke="#F2F2F2" stroke-width="5"/>
    <rect x="670" y="122" width="100" height="64" fill="#F04E0F">
      <animate attributeName="opacity" values="0.15;1" keyTimes="0;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="720" y="214" font-size="10" fill="#B0B0B0" text-anchor="middle">image 0</text>

    <rect x="820" y="112" width="120" height="84" fill="#0C0C0C" stroke="#B0B0B0" stroke-width="5"/>
    <rect x="830" y="122" width="100" height="64" fill="#F04E0F" opacity="0.15"/>
    <text x="880" y="214" font-size="10" fill="#7A7A7A" text-anchor="middle">image 1</text>

    <rect x="980" y="112" width="120" height="84" fill="#0C0C0C" stroke="#B0B0B0" stroke-width="5"/>
    <rect x="990" y="122" width="100" height="64" fill="#F04E0F" opacity="0.15"/>
    <text x="1040" y="214" font-size="10" fill="#7A7A7A" text-anchor="middle">image 2</text>

    <line x1="640" y1="520" x2="1140" y2="520" stroke="#2E2E2E" stroke-width="3"/>

    <line x1="790" y1="250" x2="700" y2="520" stroke="#B0B0B0" stroke-width="6"/>
    <line x1="790" y1="250" x2="880" y2="520" stroke="#B0B0B0" stroke-width="6"/>
    <line x1="790" y1="250" x2="790" y2="520" stroke="#7A7A7A" stroke-width="4"/>
    <rect x="704" y="270" width="172" height="130" fill="#2E2E2E" stroke="#F2F2F2" stroke-width="3"/>
    <text x="790" y="344" font-size="30" font-weight="700" fill="#7A7A7A" text-anchor="middle">?
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.12" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="706" y="272" width="0" height="126" fill="#F04E0F">
      <animate attributeName="width" values="0;0;168;168" keyTimes="0;0.12;0.65;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 168 0; 168 0; 0 0" keyTimes="0;0.12;0.65;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect x="700" y="262" width="12" height="146" fill="#F2F2F2"/>
      <line x1="706" y1="408" x2="706" y2="446" stroke="#B0B0B0" stroke-width="4"/>
      <rect x="700" y="446" width="12" height="30" fill="#F04E0F"/>
    </g>
    <rect x="696" y="400" width="188" height="12" fill="#B0B0B0"/>

    <line x1="790" y1="412" x2="790" y2="426" stroke="#7A7A7A" stroke-width="2"/>
    <rect x="726" y="426" width="128" height="34" fill="#141414" stroke="#F04E0F" stroke-width="2"/>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="790" y="448" fill="#7A7A7A">Unknown<animate attributeName="opacity" values="1;0" keyTimes="0;0.12" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="790" y="448" fill="#FFC23D" opacity="0">ColorAttachment<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.12;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      <text x="790" y="448" fill="#F04E0F" opacity="0">Present<animate attributeName="opacity" values="0;1" keyTimes="0;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    </g>
    <text x="790" y="540" font-size="10" fill="#7A7A7A" text-anchor="middle">VkImage · the canvas</text>
    <text x="900" y="300" font-size="10" fill="#FFC23D">vkCmdBegin</text>
    <text x="900" y="314" font-size="10" fill="#FFC23D">Rendering</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 -8; 0 6; 0 0" dur="4s" repeatCount="indefinite"/>
      <circle cx="1000" cy="330" r="40" fill="#0C0C0C"/>
      <g clip-path="url(#lens)">
        <rect x="960" y="290" width="80" height="80" fill="#2E2E2E"/>
        <g fill="#F04E0F">
          <rect x="960" y="290" width="20" height="20"/><rect x="1000" y="290" width="20" height="20"/>
          <rect x="980" y="310" width="20" height="20"/><rect x="1020" y="310" width="20" height="20"/>
          <rect x="960" y="330" width="20" height="20"/><rect x="1000" y="330" width="20" height="20"/>
          <rect x="980" y="350" width="20" height="20"/><rect x="1020" y="350" width="20" height="20"/>
        </g>
      </g>
      <circle cx="1000" cy="330" r="40" fill="none" stroke="#F2F2F2" stroke-width="6"/>
      <line x1="1029" y1="359" x2="1062" y2="392" stroke="#F2F2F2" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="1000" y="410" font-size="11" font-weight="700" fill="#F2F2F2" text-anchor="middle">VkImageView</text>
    <text x="1000" y="424" font-size="9" fill="#7A7A7A" text-anchor="middle">how to look at it</text>

    <rect x="932" y="448" width="208" height="64" fill="#EDE6D6"/>
    <rect x="938" y="454" width="196" height="52" fill="none" stroke="#B0B0B0" stroke-width="1"/>
    <text x="1036" y="472" font-size="10" font-weight="700" fill="#141414" text-anchor="middle">ON LOAN FROM THE SWAPCHAIN</text>
    <text x="1036" y="488" font-size="9" fill="#333" text-anchor="middle">VulkanImageType::Swapchain</text>
    <text x="1036" y="500" font-size="9" fill="#C8102E" text-anchor="middle">do not destroy the image</text>
  </g>
</svg>
