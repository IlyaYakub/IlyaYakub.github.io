    <circle cx="1060" cy="384" r="8" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>

    <path d="M818 374 V272 H962 V374" fill="none" stroke="#F04E0F" stroke-width="10"/>
    <rect x="812" y="252" width="156" height="24" fill="#F04E0F"/>
    <text x="890" y="269" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="2">VALIDATION</text>
