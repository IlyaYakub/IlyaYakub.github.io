    <text x="640" y="506" font-size="11" fill="#7A7A7A">calls go</text>
    <text x="640" y="524" font-size="11" fill="#7A7A7A">straight</text>
    <text x="640" y="542" font-size="11" fill="#7A7A7A">through</text>
