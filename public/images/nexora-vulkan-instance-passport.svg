  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VKB::INSTANCEBUILDER</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">builder</tspan>
    <tspan x="76" y="346">    .set_app_name(<tspan fill="#B0B0B0">"Nexora"</tspan>)</tspan>
    <tspan x="76" y="370">    .require_api_version(<tspan fill="#F04E0F">1, 3, 0</tspan>)</tspan>
    <tspan x="76" y="394">    .request_validation_layers()</tspan>
    <tspan x="76" y="418">    .set_debug_callback(...);</tspan>
  </text>
  <text x="76" y="446" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// validation: only when !NDEBUG</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">~VulkanInstance()</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">destroy_debug_utils_messenger(...);</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">vkDestroyInstance(m_instance, nullptr);</text>

