  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#11</text>

  <text x="56" y="192" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#F2F2F2" letter-spacing="-3">INSTANCE</text>
