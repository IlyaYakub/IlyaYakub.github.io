  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="298">now   = steady_clock::now();</tspan>
    <tspan x="76" y="330"><tspan fill="#F04E0F">delta</tspan> = now - lastTick;</tspan>
    <tspan x="76" y="362"><tspan fill="#B0B0B0">total</tspan> = now - start;</tspan>
    <tspan x="76" y="394">lastTick = now;</tspan>
  </text>
  <text x="76" y="422" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#7A7A7A">duration&lt;float&gt;(...).count() → seconds</text>

