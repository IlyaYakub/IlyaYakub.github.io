  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">cmake_minimum_required(VERSION <tspan fill="#F04E0F">3.25</tspan>)</tspan>
    <tspan x="76" y="346">project(Nexora LANGUAGES CXX)</tspan>
    <tspan x="76" y="370">set(CMAKE_CXX_STANDARD <tspan fill="#F04E0F">23</tspan>)</tspan>
    <tspan x="76" y="394">add_library(NexoraEngineLib ...)</tspan>
    <tspan x="76" y="418">add_executable(NexoraEngine ...)</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// the blueprint: what to build and how</text>

