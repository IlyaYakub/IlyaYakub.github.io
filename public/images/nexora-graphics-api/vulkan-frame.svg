<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A7A7A"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F04E0F"/>
    </marker>
  </defs>
  <rect width="960" height="410" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="409" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">one frame in VulkanViewport</text>
    <rect x="30" y="64" width="420" height="250" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="42" y="84" font-size="11" fill="#7A7A7A">beginFrame()</text>
    <rect x="510" y="64" width="420" height="250" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="522" y="84" font-size="11" fill="#7A7A7A">endFrame()</text>
    <rect x="50" y="96" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="140.0" y="129.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">wait fence</text>
    <text x="140.0" y="147.0" font-size="11" fill="#7A7A7A" text-anchor="middle">frame N done?</text>
    <rect x="250" y="96" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="340.0" y="129.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">acquire image</text>
    <text x="340.0" y="147.0" font-size="11" fill="#7A7A7A" text-anchor="middle">signals S1</text>
    <rect x="50" y="196" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="140.0" y="236.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">reset fence</text>
    <rect x="250" y="196" width="180" height="70" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="340.0" y="229.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">begin</text>
    <text x="340.0" y="247.0" font-size="11" fill="#7A7A7A" text-anchor="middle">record</text>
    <rect x="530" y="96" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="620.0" y="129.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">to Present</text>
    <text x="620.0" y="147.0" font-size="11" fill="#7A7A7A" text-anchor="middle">barrier</text>
    <rect x="730" y="96" width="180" height="70" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="820.0" y="129.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">end + submit</text>
    <text x="820.0" y="147.0" font-size="11" fill="#7A7A7A" text-anchor="middle">wait S1, signal S2</text>
    <rect x="530" y="196" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="620.0" y="229.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">present</text>
    <text x="620.0" y="247.0" font-size="11" fill="#7A7A7A" text-anchor="middle">waits S2</text>
    <rect x="730" y="196" width="180" height="70" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="820.0" y="229.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">next frame</text>
    <text x="820.0" y="247.0" font-size="11" fill="#7A7A7A" text-anchor="middle">0 -&gt; 1 -&gt; 0</text>
    <line x1="230" y1="131" x2="248" y2="131" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="340" y1="166" x2="140" y2="194" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="230" y1="231" x2="248" y2="231" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="430" y1="231" x2="528" y2="131" stroke="#F04E0F" stroke-width="2" marker-end="url(#o)"/>
    <text x="470" y="262" font-size="11" fill="#F04E0F" text-anchor="middle">renderer records</text>
    <line x1="710" y1="131" x2="728" y2="131" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="820" y1="166" x2="620" y2="194" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="710" y1="231" x2="728" y2="231" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <text x="30" y="350" font-size="12" fill="#F2F2F2" text-anchor="start">two frames in flight: while the GPU draws frame 0, the CPU already records frame 1</text>

    <text x="30" y="386" font-size="13" fill="#7A7A7A">fence: CPU waits for GPU  ·  semaphores S1/S2: GPU steps wait for each other</text>
  </g>
</svg>
