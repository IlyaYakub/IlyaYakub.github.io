<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A7A7A"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F04E0F"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="399" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">commands: recorded on the CPU, played on the GPU</text>
    <rect x="30" y="110" width="150" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="105.0" y="140.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">Renderer</text>
    <text x="105.0" y="158.0" font-size="11" fill="#7A7A7A" text-anchor="middle">knows no Vulkan</text>
    <rect x="230" y="110" width="190" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="325.0" y="140.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">IRHICommandList</text>
    <text x="325.0" y="158.0" font-size="11" fill="#7A7A7A" text-anchor="middle">beginRendering(tex)</text>
    <rect x="470" y="110" width="210" height="64" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="575.0" y="140.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanCommandList</text>
    <text x="575.0" y="158.0" font-size="11" fill="#7A7A7A" text-anchor="middle">vkCmd* calls</text>
    <rect x="730" y="110" width="200" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="830.0" y="140.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanCommandBuffer</text>
    <text x="830.0" y="158.0" font-size="11" fill="#7A7A7A" text-anchor="middle">the recorded tape</text>
    <line x1="180" y1="142" x2="228" y2="142" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="420" y1="142" x2="468" y2="142" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="680" y1="142" x2="728" y2="142" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <text x="704.0" y="134.0" font-size="11" fill="#7A7A7A" text-anchor="middle">record</text>
    <rect x="730" y="260" width="200" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="830.0" y="290.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanQueue</text>
    <text x="830.0" y="308.0" font-size="11" fill="#7A7A7A" text-anchor="middle">submit2 + present</text>
    <rect x="470" y="260" width="210" height="64" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="575.0" y="290.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">GPU</text>
    <text x="575.0" y="308.0" font-size="11" fill="#7A7A7A" text-anchor="middle">runs the tape</text>
    <line x1="830" y1="174" x2="830" y2="258" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <text x="890" y="222" font-size="11" fill="#7A7A7A" text-anchor="middle">end() + submit</text>
    <line x1="730" y1="292" x2="682" y2="292" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <rect x="230" y="260" width="190" height="64" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="325.0" y="290.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">CommandPool</text>
    <text x="325.0" y="308.0" font-size="11" fill="#7A7A7A" text-anchor="middle">owns buffer memory</text>
    <line x1="420" y1="272" x2="728" y2="160" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <text x="600" y="232" font-size="11" fill="#7A7A7A" text-anchor="middle">allocate</text>

    <text x="30" y="376" font-size="13" fill="#7A7A7A">the renderer records through the RHI interface; only VulkanCommandList turns it into vkCmd* calls</text>
  </g>
</svg>
