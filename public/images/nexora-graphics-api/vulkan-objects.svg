<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A7A7A"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F04E0F"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="439" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">who owns what</text>
    <rect x="30" y="64" width="900" height="150" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="42" y="84" font-size="11" fill="#7A7A7A">VulkanRHIDevice : IRHIDevice  (one per engine)</text>
    <rect x="50" y="100" width="200" height="90" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="150.0" y="143.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanInstance</text>
    <text x="150.0" y="161.0" font-size="11" fill="#7A7A7A" text-anchor="middle">loader + validation</text>
    <rect x="290" y="100" width="220" height="90" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="400.0" y="143.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanDevice</text>
    <text x="400.0" y="161.0" font-size="11" fill="#7A7A7A" text-anchor="middle">physical + logical</text>
    <rect x="550" y="100" width="160" height="90" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="630.0" y="143.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanQueue</text>
    <text x="630.0" y="161.0" font-size="11" fill="#7A7A7A" text-anchor="middle">graphics family</text>
    <rect x="750" y="100" width="160" height="90" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="830.0" y="143.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">CommandPool</text>
    <text x="830.0" y="161.0" font-size="11" fill="#7A7A7A" text-anchor="middle">buffers come from here</text>
    <line x1="250" y1="145" x2="288" y2="145" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="510" y1="145" x2="548" y2="145" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="710" y1="145" x2="748" y2="145" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <rect x="30" y="240" width="900" height="150" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="42" y="260" font-size="11" fill="#7A7A7A">VulkanViewport : IRHIViewport  (one per window)</text>
    <rect x="50" y="276" width="200" height="90" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="150.0" y="319.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanSurface</text>
    <text x="150.0" y="337.0" font-size="11" fill="#7A7A7A" text-anchor="middle">HWND -&gt; VkSurfaceKHR</text>
    <rect x="290" y="276" width="220" height="90" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="400.0" y="319.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">VulkanSwapchain</text>
    <text x="400.0" y="337.0" font-size="11" fill="#7A7A7A" text-anchor="middle">N images to show</text>
    <rect x="550" y="276" width="360" height="90" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="730.0" y="319.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">PresentationState</text>
    <text x="730.0" y="337.0" font-size="11" fill="#7A7A7A" text-anchor="middle">2 frames: cmd buffer, fence, semaphore</text>
    <line x1="250" y1="321" x2="288" y2="321" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="510" y1="321" x2="548" y2="321" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="230" y1="190" x2="230" y2="274" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <text x="276" y="236" font-size="11" fill="#7A7A7A" text-anchor="middle">instance</text>

    <text x="30" y="416" font-size="13" fill="#7A7A7A">each arrow: the right one is created from the left one; Engine sees only IRHIDevice and IRHIViewport</text>
  </g>
</svg>
