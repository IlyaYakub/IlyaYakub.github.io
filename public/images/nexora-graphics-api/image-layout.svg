<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <rect width="960" height="400" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="399" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">layout transition: the same pixels, arranged for the next use</text>

    <g transform="translate(80 80)">
      <rect width="240" height="240" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
      <g fill="#F2F2F2" opacity="0.9">
        <rect x="4" y="4" width="52" height="52" fill="#F04E0F"/><rect x="64" y="4" width="52" height="52" fill="#F04E0F" opacity="0.8"/><rect x="124" y="4" width="52" height="52" fill="#F04E0F" opacity="0.6"/><rect x="184" y="4" width="52" height="52" fill="#F04E0F" opacity="0.4"/>
        <rect x="4" y="64" width="52" height="52" fill="#B0B0B0"/><rect x="64" y="64" width="52" height="52" fill="#B0B0B0" opacity="0.8"/><rect x="124" y="64" width="52" height="52" fill="#B0B0B0" opacity="0.6"/><rect x="184" y="64" width="52" height="52" fill="#B0B0B0" opacity="0.4"/>
        <rect x="4" y="124" width="52" height="52" fill="#F04E0F"/><rect x="64" y="124" width="52" height="52" fill="#F04E0F" opacity="0.8"/><rect x="124" y="124" width="52" height="52" fill="#F04E0F" opacity="0.6"/><rect x="184" y="124" width="52" height="52" fill="#F04E0F" opacity="0.4"/>
        <rect x="4" y="184" width="52" height="52" fill="#B0B0B0"/><rect x="64" y="184" width="52" height="52" fill="#B0B0B0" opacity="0.8"/><rect x="124" y="184" width="52" height="52" fill="#B0B0B0" opacity="0.6"/><rect x="184" y="184" width="52" height="52" fill="#B0B0B0" opacity="0.4"/>
      </g>
      <g font-size="15" font-weight="700" fill="#141414" text-anchor="middle">
        <text x="30" y="36">0</text><text x="90" y="36">1</text><text x="150" y="36">2</text><text x="210" y="36">3</text>
        <text x="30" y="96">4</text><text x="90" y="96">5</text><text x="150" y="96">6</text><text x="210" y="96">7</text>
        <text x="30" y="156">8</text><text x="90" y="156">9</text><text x="150" y="156">10</text><text x="210" y="156">11</text>
        <text x="30" y="216">12</text><text x="90" y="216">13</text><text x="150" y="216">14</text><text x="210" y="216">15</text>
      </g>
      <text x="120" y="268" font-size="13" fill="#F2F2F2" text-anchor="middle">COLOR_ATTACHMENT_OPTIMAL</text>
      <text x="120" y="288" font-size="12" fill="#7A7A7A" text-anchor="middle">rows: easy to fill</text>
    </g>

    <g transform="translate(640 80)">
      <rect width="240" height="240" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2"/>
      <g>
        <rect x="4" y="4" width="52" height="52" fill="#F04E0F"/><rect x="64" y="4" width="52" height="52" fill="#F04E0F" opacity="0.8"/><rect x="124" y="4" width="52" height="52" fill="#B0B0B0"/><rect x="184" y="4" width="52" height="52" fill="#B0B0B0" opacity="0.8"/>
        <rect x="4" y="64" width="52" height="52" fill="#F04E0F" opacity="0.6"/><rect x="64" y="64" width="52" height="52" fill="#F04E0F" opacity="0.4"/><rect x="124" y="64" width="52" height="52" fill="#B0B0B0" opacity="0.6"/><rect x="184" y="64" width="52" height="52" fill="#B0B0B0" opacity="0.4"/>
        <rect x="4" y="124" width="52" height="52" fill="#F04E0F"/><rect x="64" y="124" width="52" height="52" fill="#F04E0F" opacity="0.8"/><rect x="124" y="124" width="52" height="52" fill="#B0B0B0"/><rect x="184" y="124" width="52" height="52" fill="#B0B0B0" opacity="0.8"/>
        <rect x="4" y="184" width="52" height="52" fill="#F04E0F" opacity="0.6"/><rect x="64" y="184" width="52" height="52" fill="#F04E0F" opacity="0.4"/><rect x="124" y="184" width="52" height="52" fill="#B0B0B0" opacity="0.6"/><rect x="184" y="184" width="52" height="52" fill="#B0B0B0" opacity="0.4"/>
      </g>
      <g font-size="15" font-weight="700" fill="#141414" text-anchor="middle">
        <text x="30" y="36">0</text><text x="90" y="36">1</text><text x="150" y="36">4</text><text x="210" y="36">5</text>
        <text x="30" y="96">2</text><text x="90" y="96">3</text><text x="150" y="96">6</text><text x="210" y="96">7</text>
        <text x="30" y="156">8</text><text x="90" y="156">9</text><text x="150" y="156">12</text><text x="210" y="156">13</text>
        <text x="30" y="216">10</text><text x="90" y="216">11</text><text x="150" y="216">14</text><text x="210" y="216">15</text>
      </g>
      <g fill="none" stroke="#FFC23D" stroke-width="3">
        <rect x="2" y="2" width="116" height="116"/><rect x="122" y="2" width="116" height="116"/>
        <rect x="2" y="122" width="116" height="116"/><rect x="122" y="122" width="116" height="116"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="5s" repeatCount="indefinite"/>
      </g>
      <text x="120" y="268" font-size="13" fill="#F2F2F2" text-anchor="middle">SHADER_READ_ONLY_OPTIMAL</text>
      <text x="120" y="288" font-size="12" fill="#7A7A7A" text-anchor="middle">tiles: neighbours read together</text>
    </g>

    <g>
      <path d="M350 200 H610" stroke="#FFC23D" stroke-width="4" stroke-dasharray="14 10">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M598 188 L614 200 L598 212" fill="none" stroke="#FFC23D" stroke-width="4"/>
      <text x="480" y="180" font-size="14" font-weight="700" fill="#FFC23D" text-anchor="middle">barrier</text>
      <text x="480" y="230" font-size="12" fill="#B0B0B0" text-anchor="middle">oldLayout → newLayout</text>
    </g>

    <text x="30" y="386" font-size="13" fill="#B0B0B0">the real arrangement is the driver's secret; UNDEFINED as oldLayout means "throw the old pixels away"</text>
  </g>
</svg>
