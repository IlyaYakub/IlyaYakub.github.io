<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F04E0F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F04E0F" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#19</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">SYNC</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">a barrier is a canal lock</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">VULKANSYNC::TRANSITIONIMAGE</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">old = toSyncState(image.<tspan fill="#F04E0F">state</tspan>());</tspan>
    <tspan x="76" y="346">new = toSyncState(newState);</tspan>
    <tspan x="76" y="370">.srcStageMask = old.stage, .oldLayout = old.layout</tspan>
    <tspan x="76" y="394">.dstStageMask = new.stage, .newLayout = new.layout</tspan>
    <tspan x="76" y="418">vkCmd<tspan fill="#F04E0F">PipelineBarrier2</tspan>(...); image.setState(newState);</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// state -> stage + access + layout, one flat switch</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">every frame:</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">Present -&gt; ColorAttachment -&gt; Present</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// Unknown only on the image's very first frame</text>

  <g class="m">
    <rect x="814" y="70" width="152" height="42" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="890" y="88" font-size="10" fill="#7A7A7A" text-anchor="middle" letter-spacing="1">LOCK KEEPER</text>
    <text x="890" y="104" font-size="11" font-weight="700" fill="#F04E0F" text-anchor="middle">PipelineBarrier2</text>
    <line x1="890" y1="112" x2="890" y2="150" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="3 4"/>

    <text x="660" y="160" font-size="10" fill="#7A7A7A" letter-spacing="1">UPSTREAM</text>
    <text x="660" y="178" font-size="12" font-weight="700" fill="#FFC23D">ColorAttachment</text>
    <text x="660" y="194" font-size="9" fill="#7A7A7A">COLOR_ATTACHMENT_OPTIMAL</text>
    <text x="1120" y="160" font-size="10" fill="#7A7A7A" letter-spacing="1" text-anchor="end">DOWNSTREAM</text>
    <text x="1120" y="178" font-size="12" font-weight="700" fill="#F04E0F" text-anchor="end">Present</text>
    <text x="1120" y="194" font-size="9" fill="#7A7A7A" text-anchor="end">PRESENT_SRC_KHR</text>

    <rect x="640" y="290" width="160" height="180" fill="url(#water)"/>
    <rect x="980" y="380" width="160" height="90" fill="url(#water)"/>
    <rect x="806" y="290" width="168" height="180" fill="url(#water)">
      <animate attributeName="y" values="290;290;380;380;290;290" keyTimes="0;0.38;0.6;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="180;180;90;90;180;180" keyTimes="0;0.38;0.6;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <path d="M640 290 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#F04E0F" stroke-width="2"/>
    <path d="M980 380 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#F04E0F" stroke-width="2"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;170 0;170 0;170 90;170 90;340 90;340 90;0 0" keyTimes="0;0.15;0.3;0.38;0.6;0.68;0.85;0.99;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.85;0.92;0.99;1" dur="8s" repeatCount="indefinite"/>
      <polygon points="656,282 768,282 752,304 672,304" fill="#F2F2F2"/>
      <rect x="690" y="236" width="44" height="46" fill="#F04E0F" stroke="#F2F2F2" stroke-width="2"/>
      <text x="712" y="264" font-size="11" font-weight="700" fill="#141414" text-anchor="middle">img</text>
      <line x1="742" y1="282" x2="742" y2="248" stroke="#B0B0B0" stroke-width="2"/>
      <polygon points="744,248 762,258 744,266" fill="#FFC23D"/>
    </g>

    <rect x="640" y="470" width="500" height="20" fill="#2E2E2E"/>
    <rect x="788" y="220" width="18" height="250" fill="#7A7A7A"/>
    <rect x="974" y="220" width="18" height="250" fill="#7A7A7A"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -130;0 -130;0 0;0 0;0 -130" keyTimes="0;0.3;0.38;0.97;1" dur="8s" repeatCount="indefinite"/>
      <rect x="800" y="260" width="12" height="210" fill="#F2F2F2"/>
      <line x1="800" y1="300" x2="812" y2="300" stroke="#141414" stroke-width="2"/>
      <line x1="800" y1="360" x2="812" y2="360" stroke="#141414" stroke-width="2"/>
      <line x1="800" y1="420" x2="812" y2="420" stroke="#141414" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -130;0 -130;0 0;0 0" keyTimes="0;0.6;0.68;0.88;0.92;1" dur="8s" repeatCount="indefinite"/>
      <rect x="968" y="260" width="12" height="210" fill="#F2F2F2"/>
      <line x1="968" y1="300" x2="980" y2="300" stroke="#141414" stroke-width="2"/>
      <line x1="968" y1="360" x2="980" y2="360" stroke="#141414" stroke-width="2"/>
      <line x1="968" y1="420" x2="980" y2="420" stroke="#141414" stroke-width="2"/>
    </g>
    <rect x="780" y="208" width="34" height="14" fill="#B0B0B0"/>
    <rect x="966" y="208" width="34" height="14" fill="#B0B0B0"/>

    <text x="774" y="232" font-size="10" font-weight="700" fill="#F2F2F2" text-anchor="end">src gate</text>
    <text x="1006" y="232" font-size="10" font-weight="700" fill="#F2F2F2">dst gate</text>

    <rect x="640" y="504" width="240" height="50" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="652" y="524" font-size="10" fill="#7A7A7A">srcStage  ALL_TRANSFER</text>
    <text x="652" y="542" font-size="10" fill="#7A7A7A">srcAccess TRANSFER_WRITE</text>
    <rect x="900" y="504" width="240" height="50" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="912" y="524" font-size="10" fill="#7A7A7A">dstStage  COLOR_ATTACHMENT_OUT</text>
    <text x="912" y="542" font-size="10" fill="#7A7A7A">dstAccess NONE</text>

    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="890" y="250" fill="#7A7A7A">waiting for rendering<animate attributeName="opacity" values="1;0" keyTimes="0;0.38" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
      <text x="890" y="250" fill="#FFC23D" opacity="0">layout changes<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.38;0.6" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
      <text x="890" y="250" fill="#F04E0F" opacity="0">ready to present<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.92" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
