<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#2</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">GRAPHICS API</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">Vulkan now, any API later</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">THE RHI</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322"><tspan fill="#F04E0F">IRHIDevice</tspan>       creates everything</tspan>
    <tspan x="76" y="346"><tspan fill="#F04E0F">IRHIViewport</tspan>     begin/endFrame, resize</tspan>
    <tspan x="76" y="370"><tspan fill="#F04E0F">IRHICommandList</tspan>  begin/endRendering</tspan>
    <tspan x="76" y="394"><tspan fill="#F04E0F">IRHITexture</tspan>      an image on the GPU</tspan>
  </text>
  <text class="m" x="76" y="440" font-size="12" fill="#7A7A7A">// the renderer sees only these four</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">// the only line that names the backend:</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">m_rhiDevice(std::make_unique&lt;<tspan fill="#F04E0F">VulkanRHIDevice</tspan>&gt;())</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// new API = new RHI/ folder + this line</text>

  <g class="m">
    <rect x="790" y="70" width="200" height="54" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="890" y="96" font-size="15" font-weight="700" fill="#F2F2F2" text-anchor="middle">Renderer</text>
    <text x="890" y="114" font-size="10" fill="#7A7A7A" text-anchor="middle">knows no Vulkan</text>
    <line x1="890" y1="124" x2="890" y2="190" stroke="#F2F2F2" stroke-width="4"/>

    <rect x="680" y="190" width="420" height="72" fill="#1A1A1A" stroke="#F04E0F" stroke-width="3"/>
    <text x="696" y="212" font-size="13" font-weight="700" fill="#F04E0F">RHI</text>
    <text x="1084" y="212" font-size="10" fill="#7A7A7A" text-anchor="end">one socket shape for every API</text>
    <rect x="720" y="226" width="80" height="24" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="850" y="226" width="80" height="24" fill="#0C0C0C" stroke="#2E2E2E"/>
    <rect x="980" y="226" width="80" height="24" fill="#0C0C0C" stroke="#2E2E2E"/>
    <g fill="#7A7A7A">
      <rect x="872" y="232" width="8" height="12"/><rect x="900" y="232" width="8" height="12"/>
      <rect x="1002" y="232" width="8" height="12"/><rect x="1030" y="232" width="8" height="12"/>
    </g>

    <rect x="742" y="236" width="8" height="30" fill="#F2F2F2"/><rect x="770" y="236" width="8" height="30" fill="#F2F2F2"/>
    <rect x="715" y="264" width="90" height="56" fill="#F04E0F"/>
    <text x="760" y="297" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">VULKAN</text>
    <line x1="760" y1="320" x2="760" y2="452" stroke="#F04E0F" stroke-width="4"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="872" y="306" width="8" height="30" fill="#7A7A7A"/><rect x="900" y="306" width="8" height="30" fill="#7A7A7A"/>
      <rect x="845" y="334" width="90" height="56" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="890" y="362" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">D3D12</text>
      <text x="890" y="378" font-size="10" fill="#7A7A7A" text-anchor="middle">planned</text>
      <path d="M890 390 C 890 430, 870 440, 870 480" fill="none" stroke="#7A7A7A" stroke-width="3" stroke-dasharray="6 6"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -10;0 0;0 -10" dur="3s" repeatCount="indefinite"/>
      <rect x="1002" y="306" width="8" height="30" fill="#7A7A7A"/><rect x="1030" y="306" width="8" height="30" fill="#7A7A7A"/>
      <rect x="975" y="334" width="90" height="56" fill="#1A1A1A" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="1020" y="362" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">OPENGL</text>
      <text x="1020" y="378" font-size="10" fill="#7A7A7A" text-anchor="middle">planned</text>
      <path d="M1020 390 C 1020 430, 1050 440, 1050 480" fill="none" stroke="#7A7A7A" stroke-width="3" stroke-dasharray="6 6"/>
    </g>

    <rect x="690" y="452" width="140" height="80" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <g stroke="#7A7A7A" stroke-width="3">
      <line x1="710" y1="532" x2="710" y2="546"/><line x1="735" y1="532" x2="735" y2="546"/><line x1="760" y1="532" x2="760" y2="546"/>
      <line x1="785" y1="532" x2="785" y2="546"/><line x1="810" y1="532" x2="810" y2="546"/>
    </g>
    <text x="760" y="490" font-size="15" font-weight="700" fill="#F2F2F2" text-anchor="middle">GPU</text>
    <text x="760" y="510" font-size="10" fill="#7A7A7A" text-anchor="middle">draws the back buffer</text>
    <circle cx="806" cy="470" r="5" fill="#F04E0F">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <circle r="6" fill="#F04E0F" cx="890" cy="150">
      <animate attributeName="cy" values="130;186" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#F2F2F2" cx="760" cy="380">
      <animate attributeName="cy" values="324;448" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <text x="1130" y="568" font-size="11" fill="#7A7A7A" text-anchor="end">swap the plug, keep the renderer</text>
  </g>
</svg>
