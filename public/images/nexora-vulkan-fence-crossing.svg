<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}.h{font-family:'Inter Tight','Segoe UI',Arial,sans-serif;font-weight:900}</style>
  <defs>
    <clipPath id="scene"><rect x="640" y="60" width="500" height="500"/></clipPath>
    <pattern id="stripes" width="28" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#F04E0F"/>
      <rect x="14" width="14" height="14" fill="#F2F2F2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text class="m" x="108" y="81" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text class="m" x="172" y="81" font-size="14" fill="#7A7A7A" letter-spacing="2">#14</text>

  <text class="h" x="56" y="192" font-size="82" fill="#F2F2F2" letter-spacing="-3">FENCE</text>
  <text class="m" x="60" y="234" font-size="18" fill="#F04E0F">the CPU waits at the crossing</text>

  <rect x="60" y="264" width="500" height="196" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text class="m" x="76" y="290" font-size="12" fill="#7A7A7A" letter-spacing="2">VULKANVIEWPORT::BEGINFRAME</text>
  <text class="m" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="322">inFlightFence.<tspan fill="#F04E0F">wait</tspan>();</tspan>
    <tspan x="76" y="346">setImageIndex(acquireNextImage(...));</tspan>
    <tspan x="76" y="370">inFlightFence.<tspan fill="#F04E0F">reset</tspan>();</tspan>
    <tspan x="76" y="394"><tspan fill="#7A7A7A">...</tspan></tspan>
    <tspan x="76" y="418">queue.submit(..., <tspan fill="#F04E0F">inFlightFence</tspan>);</tspan>
  </text>
  <text class="m" x="76" y="446" font-size="12" fill="#7A7A7A">// one fence per frame in flight</text>

  <text class="m" x="60" y="508" font-size="14" fill="#7A7A7A">VkFenceCreateInfo</text>
  <text class="m" x="60" y="532" font-size="14" fill="#F2F2F2">.flags = VK_FENCE_CREATE_SIGNALED_BIT</text>
  <text class="m" x="60" y="556" font-size="14" fill="#7A7A7A">// so the very first wait() passes at once</text>

  <g class="m">
    <rect x="760" y="60" width="120" height="500" fill="#1A1A1A"/>
    <line x1="820" y1="70" x2="820" y2="550" stroke="#7A7A7A" stroke-width="3" stroke-dasharray="20 18"/>

    <g fill="#2E2E2E">
      <rect x="640" y="236" width="500" height="10"/>
    </g>
    <g stroke="#3A3A3A" stroke-width="8">
      <line x1="650" y1="220" x2="650" y2="300"/><line x1="690" y1="220" x2="690" y2="300"/><line x1="730" y1="220" x2="730" y2="300"/>
      <line x1="770" y1="220" x2="770" y2="300"/><line x1="810" y1="220" x2="810" y2="300"/><line x1="850" y1="220" x2="850" y2="300"/>
      <line x1="890" y1="220" x2="890" y2="300"/><line x1="930" y1="220" x2="930" y2="300"/><line x1="970" y1="220" x2="970" y2="300"/>
      <line x1="1010" y1="220" x2="1010" y2="300"/><line x1="1050" y1="220" x2="1050" y2="300"/><line x1="1090" y1="220" x2="1090" y2="300"/><line x1="1130" y1="220" x2="1130" y2="300"/>
    </g>
    <line x1="640" y1="232" x2="1140" y2="232" stroke="#B0B0B0" stroke-width="4"/>
    <line x1="640" y1="288" x2="1140" y2="288" stroke="#B0B0B0" stroke-width="4"/>

    <g clip-path="url(#scene)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-560 0; 620 0; 620 0" keyTimes="0;0.55;1" dur="5s" repeatCount="indefinite"/>
        <rect x="560" y="214" width="190" height="90" fill="#F04E0F"/>
        <rect x="720" y="196" width="30" height="18" fill="#F04E0F"/>
        <rect x="574" y="228" width="34" height="28" fill="#141414"/>
        <rect x="618" y="228" width="34" height="28" fill="#141414"/>
        <rect x="662" y="228" width="34" height="28" fill="#141414"/>
        <text x="640" y="290" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">GPU · frame 0</text>
        <rect x="360" y="214" width="190" height="90" fill="#F2F2F2"/>
        <rect x="374" y="228" width="34" height="28" fill="#141414"/>
        <rect x="418" y="228" width="34" height="28" fill="#141414"/>
        <rect x="462" y="228" width="34" height="28" fill="#141414"/>
        <text x="455" y="290" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">draw commands</text>
      </g>
    </g>

    <rect x="726" y="320" width="12" height="160" fill="#F2F2F2"/>
    <rect x="712" y="476" width="40" height="10" fill="#7A7A7A"/>
    <line x1="732" y1="330" x2="696" y2="330" stroke="#F2F2F2" stroke-width="4"/>
    <circle cx="694" cy="330" r="12" fill="#FF4D4D">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="732" y1="330" x2="768" y2="330" stroke="#F2F2F2" stroke-width="4"/>
    <circle cx="770" cy="330" r="12" fill="#FF4D4D">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 732 380; 0 732 380; -80 732 380; -80 732 380; 0 732 380" keyTimes="0;0.6;0.68;0.92;1" dur="5s" repeatCount="indefinite"/>
      <rect x="732" y="372" width="170" height="16" fill="url(#stripes)" stroke="#141414" stroke-width="1"/>
      <circle cx="732" cy="380" r="9" fill="#7A7A7A"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 -16; 0 0" keyTimes="0;0.7;0.85;1" dur="5s" repeatCount="indefinite"/>
      <rect x="790" y="412" width="60" height="96" fill="#F2F2F2"/>
      <rect x="798" y="424" width="44" height="22" fill="#141414"/>
      <rect x="798" y="476" width="44" height="18" fill="#2E2E2E"/>
      <rect x="784" y="424" width="6" height="18" fill="#7A7A7A"/>
      <rect x="850" y="424" width="6" height="18" fill="#7A7A7A"/>
      <rect x="784" y="478" width="6" height="18" fill="#7A7A7A"/>
      <rect x="850" y="478" width="6" height="18" fill="#7A7A7A"/>
      <text x="820" y="465" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">CPU</text>
    </g>

    <rect x="920" y="330" width="220" height="74" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="934" y="352" font-size="10" fill="#7A7A7A" letter-spacing="1">VkFence</text>
    <circle cx="944" cy="378" r="9" fill="#2E2E2E">
      <animate attributeName="fill" values="#2E2E2E;#2E2E2E;#F04E0F;#F04E0F;#2E2E2E" keyTimes="0;0.55;0.58;0.92;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="962" y="383" font-size="12" fill="#F2F2F2">unsignaled
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.55;0.58;0.92;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="962" y="383" font-size="12" font-weight="700" fill="#F04E0F" opacity="0">signaled
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.58;0.92;1" dur="5s" repeatCount="indefinite"/>
    </text>

    <rect x="920" y="424" width="220" height="116" fill="#0C0C0C" stroke="#2E2E2E" stroke-width="2"/>
    <text x="934" y="448" font-size="11" fill="#F2F2F2">wait()  CPU stops</text>
    <text x="934" y="470" font-size="11" fill="#F04E0F">GPU done  signal</text>
    <text x="934" y="492" font-size="11" fill="#F2F2F2">barrier up, CPU goes</text>
    <text x="934" y="514" font-size="11" fill="#F2F2F2">reset()  barrier down</text>
    <text x="934" y="532" font-size="9" fill="#7A7A7A">vkWaitForFences(..., UINT64_MAX)</text>

    <text x="900" y="96" font-size="11" fill="#7A7A7A" letter-spacing="2">GPU LINE</text>
    <text x="900" y="114" font-size="10" fill="#7A7A7A">2 frames in flight</text>
  </g>
</svg>
