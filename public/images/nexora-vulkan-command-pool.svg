<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F04E0F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F04E0F" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="basin">
      <rect x="682" y="300" width="416" height="198"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#141414"/>
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#2E2E2E"/>

  <rect x="60" y="60" width="96" height="30" fill="none" stroke="#F04E0F"/>
  <text x="108" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle" letter-spacing="2">NEXORA</text>
  <text x="172" y="81" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A" letter-spacing="2">#16</text>

  <text x="56" y="172" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="900" fill="#F2F2F2" letter-spacing="-3">COMMAND</text>
  <text x="56" y="240" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="900" fill="#F2F2F2" letter-spacing="-3">POOL</text>
  <text x="60" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#F04E0F">where command buffers swim</text>

  <rect x="60" y="300" width="500" height="166" fill="#1A1A1A" stroke="#2E2E2E"/>
  <text x="76" y="326" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A" letter-spacing="2">VKCOMMANDPOOLCREATEINFO</text>
  <text font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#F2F2F2" xml:space="preserve">
    <tspan x="76" y="358">.flags =</tspan>
    <tspan x="76" y="382">    <tspan fill="#F04E0F">RESET_COMMAND_BUFFER_BIT</tspan></tspan>
    <tspan x="76" y="406">.queueFamilyIndex =</tspan>
    <tspan x="76" y="430">    graphicsQueue().familyIndex()</tspan>
  </text>
  <text x="76" y="454" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#7A7A7A">// one pool per RHI device</text>

  <text x="60" y="508" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">VulkanCommandBuffer(device, commandPool)</text>
  <text x="60" y="532" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#F2F2F2">vkAllocateCommandBuffers(..., &amp;m_commandBuffer);</text>
  <text x="60" y="556" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#7A7A7A">// one buffer per frame in flight</text>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <rect x="640" y="70" width="230" height="128" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <rect x="640" y="70" width="230" height="28" fill="#F04E0F"/>
    <text x="755" y="89" font-size="13" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="2">POOL RULES</text>
    <text x="654" y="122" font-size="12" fill="#F2F2F2">1. one queue family</text>
    <text x="654" y="144" font-size="12" fill="#F2F2F2">2. buffers reset alone</text>
    <text x="654" y="166" font-size="12" fill="#F2F2F2">3. free before draining</text>
    <text x="654" y="188" font-size="12" fill="#7A7A7A">4. no threads in the pool</text>
    <line x1="700" y1="198" x2="700" y2="300" stroke="#7A7A7A" stroke-width="3"/>
    <line x1="810" y1="198" x2="810" y2="300" stroke="#7A7A7A" stroke-width="3"/>

    <line x1="1020" y1="300" x2="1036" y2="200" stroke="#F2F2F2" stroke-width="3"/>
    <line x1="1100" y1="300" x2="1084" y2="200" stroke="#F2F2F2" stroke-width="3"/>
    <line x1="1026" y1="262" x2="1094" y2="262" stroke="#F2F2F2" stroke-width="2"/>
    <line x1="1031" y1="230" x2="1089" y2="230" stroke="#F2F2F2" stroke-width="2"/>
    <rect x="1028" y="188" width="64" height="14" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <line x1="1060" y1="188" x2="1060" y2="112" stroke="#7A7A7A" stroke-width="2"/>
    <path d="M1010 120 Q1060 78 1110 120 Z" fill="#F04E0F"/>
    <path d="M1035 120 Q1048 92 1060 85 Q1072 92 1085 120" fill="none" stroke="#141414" stroke-width="2"/>
    <circle cx="1060" cy="166" r="10" fill="#F2F2F2"/>
    <rect x="1050" y="176" width="20" height="14" fill="#F2F2F2"/>
    <rect x="1024" y="272" width="72" height="18" fill="#141414" stroke="#F04E0F" stroke-width="1.5"/>
    <text x="1060" y="285" font-size="10" font-weight="700" fill="#F04E0F" text-anchor="middle">GRAPHICS</text>
    <text x="1060" y="318" font-size="10" fill="#7A7A7A" text-anchor="middle">queue family 0</text>

    <rect x="878" y="244" width="12" height="56" fill="#7A7A7A"/>
    <rect x="866" y="236" width="110" height="8" fill="#F04E0F"/>
    <path d="M972 232 Q1000 190 1004 300" fill="none" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g transform="translate(990 214) rotate(28)">
      <rect x="-15" y="-21" width="30" height="42" fill="#F2F2F2"/>
      <line x1="-9" y1="-11" x2="9" y2="-11" stroke="#7A7A7A" stroke-width="2"/>
      <line x1="-9" y1="-3" x2="9" y2="-3" stroke="#7A7A7A" stroke-width="2"/>
      <line x1="-9" y1="5" x2="5" y2="5" stroke="#F04E0F" stroke-width="2"/>
      <line x1="-9" y1="13" x2="9" y2="13" stroke="#7A7A7A" stroke-width="2"/>
    </g>
    <text x="924" y="226" font-size="11" fill="#7A7A7A" text-anchor="middle">allocate</text>

    <line x1="640" y1="300" x2="1140" y2="300" stroke="#7A7A7A" stroke-width="2"/>
    <rect x="682" y="300" width="416" height="198" fill="#0C0C0C"/>
    <g clip-path="url(#basin)" stroke="#1A1A1A" stroke-width="1.5">
      <line x1="722" y1="300" x2="722" y2="500"/>
      <line x1="762" y1="300" x2="762" y2="500"/>
      <line x1="802" y1="300" x2="802" y2="500"/>
      <line x1="842" y1="300" x2="842" y2="500"/>
      <line x1="882" y1="300" x2="882" y2="500"/>
      <line x1="922" y1="300" x2="922" y2="500"/>
      <line x1="962" y1="300" x2="962" y2="500"/>
      <line x1="1002" y1="300" x2="1002" y2="500"/>
      <line x1="1042" y1="300" x2="1042" y2="500"/>
      <line x1="1082" y1="300" x2="1082" y2="500"/>
      <line x1="682" y1="380" x2="1100" y2="380"/>
      <line x1="682" y1="420" x2="1100" y2="420"/>
      <line x1="682" y1="460" x2="1100" y2="460"/>
    </g>
    <g clip-path="url(#basin)">
      <path d="M682 336 q13 -8 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 V500 H682 Z" fill="url(#water)" stroke="#F04E0F" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="0 0; -26 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M682 300 V498 H1098 V300" fill="none" stroke="#F2F2F2" stroke-width="3"/>

    <text x="694" y="488" font-size="11" fill="#7A7A7A" letter-spacing="2">DEPTH · 2 FRAMES IN FLIGHT</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="2s" repeatCount="indefinite"/>
      <ellipse cx="770" cy="338" rx="44" ry="15" fill="none" stroke="#F04E0F" stroke-width="13"/>
      <ellipse cx="770" cy="338" rx="44" ry="15" fill="none" stroke="#F2F2F2" stroke-width="13" stroke-dasharray="14 20"/>
      <text x="770" y="383" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">cmd 0</text>
      <text x="770" y="399" font-size="10" fill="#7A7A7A" text-anchor="middle">recording</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -5; 0 0; 0 -5" dur="2s" repeatCount="indefinite"/>
      <ellipse cx="900" cy="338" rx="44" ry="15" fill="none" stroke="#F04E0F" stroke-width="13"/>
      <ellipse cx="900" cy="338" rx="44" ry="15" fill="none" stroke="#F2F2F2" stroke-width="13" stroke-dasharray="14 20"/>
      <text x="900" y="383" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">cmd 1</text>
      <text x="900" y="399" font-size="10" fill="#7A7A7A" text-anchor="middle">on the GPU</text>
    </g>

    <text x="890" y="540" font-size="14" font-weight="700" fill="#F04E0F" text-anchor="middle">VkCommandPool</text>
    <text x="890" y="560" font-size="11" fill="#7A7A7A" text-anchor="middle">owns the memory · buffers are allocated from it</text>
  </g>
</svg>
