<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <style>.m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A7A7A"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F04E0F"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#141414"/>
  <rect x="0.5" y="0.5" width="959" height="359" fill="none" stroke="#2E2E2E"/>
  <g class="m">
    <text x="30" y="40" font-size="16" font-weight="700" fill="#F04E0F">event flow: from the OS to whoever listens</text>
    <rect x="30" y="120" width="140" height="60" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="100.0" y="148.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">OS</text>
    <text x="100.0" y="166.0" font-size="11" fill="#7A7A7A" text-anchor="middle">key, mouse, resize</text>
    <rect x="220" y="120" width="170" height="60" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="305.0" y="148.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">GLFW callback</text>
    <text x="305.0" y="166.0" font-size="11" fill="#7A7A7A" text-anchor="middle">inline lambda</text>
    <rect x="440" y="120" width="170" height="60" fill="#1A1A1A" stroke="#F04E0F" stroke-width="2"/>
    <text x="525.0" y="148.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">InputEvent</text>
    <text x="525.0" y="166.0" font-size="11" fill="#7A7A7A" text-anchor="middle">{windowId, variant}</text>
    <rect x="660" y="120" width="270" height="60" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="795.0" y="148.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">windowEvent().invoke()</text>
    <text x="795.0" y="166.0" font-size="11" fill="#7A7A7A" text-anchor="middle">Event&lt;const InputEvent&amp;&gt;</text>
    <line x1="170" y1="150" x2="218" y2="150" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="390" y1="150" x2="438" y2="150" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <line x1="610" y1="150" x2="658" y2="150" stroke="#7A7A7A" stroke-width="2" marker-end="url(#a)"/>
    <rect x="560" y="250" width="170" height="60" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="645.0" y="278.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">Engine</text>
    <text x="645.0" y="296.0" font-size="11" fill="#7A7A7A" text-anchor="middle">logs every input</text>
    <rect x="760" y="250" width="170" height="60" fill="#1A1A1A" stroke="#F2F2F2" stroke-width="2"/>
    <text x="845.0" y="278.0" font-size="14" font-weight="700" fill="#F2F2F2" text-anchor="middle">Renderer</text>
    <text x="845.0" y="296.0" font-size="11" fill="#7A7A7A" text-anchor="middle">resize, close</text>
    <line x1="745" y1="180" x2="645" y2="248" stroke="#F04E0F" stroke-width="2" marker-end="url(#o)"/>
    <line x1="845" y1="180" x2="845" y2="248" stroke="#F04E0F" stroke-width="2" marker-end="url(#o)"/>
    <text x="30" y="230" font-size="12" fill="#F2F2F2" text-anchor="start">glfwPollEvents() inside</text>
    <text x="30" y="250" font-size="12" fill="#F2F2F2" text-anchor="start">windowManager-&gt;update()</text>
    <text x="30" y="270" font-size="12" fill="#7A7A7A" text-anchor="start">fires the callbacks</text>

    <text x="30" y="336" font-size="13" fill="#7A7A7A">the window does not know who listens; listeners subscribe with add(this, &amp;Type::method)</text>
  </g>
</svg>
